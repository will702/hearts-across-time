<!DOCTYPE html>

<title>Hearts Across Time — Break The Loop</title>
<style>
  html,body{margin:0;padding:0;background:#0a0806;height:100%;overflow:hidden;font-family:'Trebuchet MS','Segoe UI',sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:auto;touch-action:none;cursor:default;box-shadow:0 0 80px rgba(0,0,0,.8)}
  #cinematic{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#000}
  #cinematic[hidden]{display:none}
  #intro-video{width:100%;height:100%;object-fit:contain;background:#000}
  #intro-start,#intro-skip{position:absolute;border:1px solid rgba(245,240,232,.65);border-radius:4px;background:rgba(10,8,6,.76);color:#f5f0e8;font:700 15px 'Trebuchet MS',sans-serif;letter-spacing:.12em;cursor:pointer}
  #intro-start{inset:50% auto auto 50%;padding:15px 24px;transform:translate(-50%,-50%)}
  #intro-skip{right:24px;bottom:22px;padding:10px 16px}
  #intro-start:hover,#intro-start:focus-visible,#intro-skip:hover,#intro-skip:focus-visible{background:rgba(168,62,56,.9);outline:2px solid #f5f0e8;outline-offset:2px}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="cinematic" role="dialog" aria-modal="true" aria-label="Intro sinematik">
  <video id="intro-video" preload="auto" playsinline aria-label="Intro Hearts Across Time">
    <source src="assets/intro.mp4" type="video/mp4">
  </video>
  <button id="intro-start" type="button">PUTAR INTRO</button>
  <button id="intro-skip" type="button">LEWATI</button>
</div>
