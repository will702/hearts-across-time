"use strict";
/* ============================================================
   HEARTS ACROSS TIME — Break The Loop
   2D Side-Scroller Narrative Puzzle / Psychological Time-Loop
   COMPFEST Indie Game Jam — berdasarkan GDD "FIKS IDE.md"
   Semua aset digambar prosedural (palet dari referensi).
   ============================================================ */

/* ---------- Konstanta & util ---------- */
const W=960, H=540, GROUND=444;
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeO=t=>1-Math.pow(1-t,3);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function fmt(n){return Math.round(n)}

/* ---------- Skala layar ---------- */
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;

/* ---------- Audio prosedural (WebAudio) ---------- */
const AU={ctx:null,master:null,muted:false,amb:[],boomTimer:0,heartTimer:0};
function ac(){if(!AU.ctx){AU.ctx=new (window.AudioContext||window.webkitAudioContext)();AU.master=AU.ctx.createGain();AU.master.gain.value=.9;
    // graf bus: master -> limiter(kompressor) -> out ; sub-bus: SFX / Ambience / Musik
    const comp=AU.ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=18;comp.ratio.value=6;comp.attack.value=.004;comp.release.value=.24;comp.connect(AU.ctx.destination);AU.master.connect(comp);
    AU.sfxBus=AU.ctx.createGain();AU.sfxBus.connect(AU.master);
    AU.ambBus=AU.ctx.createGain();AU.ambBus.gain.value=.9;AU.ambBus.connect(AU.master);
    AU.musBus=AU.ctx.createGain();AU.musBus.gain.value=.8;AU.musBus.connect(AU.master);
    // reverb (impulse noise buatan) + feedback-delay hanya untuk musik
    AU.verb=AU.ctx.createConvolver();AU.verb.buffer=impulse(AU.ctx,2.6,2.4);const vout=AU.ctx.createGain();vout.gain.value=.5;AU.verb.connect(vout);vout.connect(AU.musBus);
    AU.dly=AU.ctx.createDelay(1);AU.dly.delayTime.value=.34;const dfb=AU.ctx.createGain();dfb.gain.value=.36;const dlp=AU.ctx.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=2400;AU.dly.connect(dlp);dlp.connect(dfb);dfb.connect(AU.dly);const dout=AU.ctx.createGain();dout.gain.value=.5;dlp.connect(dout);dout.connect(AU.musBus);
    AU.mIn=AU.ctx.createGain();AU.mIn.connect(AU.musBus);const sd=AU.ctx.createGain();sd.gain.value=.18;AU.mIn.connect(sd);sd.connect(AU.dly);const sv=AU.ctx.createGain();sv.gain.value=.32;AU.mIn.connect(sv);sv.connect(AU.verb);
  }if(AU.ctx.state==='suspended')AU.ctx.resume();return AU.ctx;}
function impulse(c,dur,decay){const n=c.sampleRate*dur,b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}return b;}
function beep(f,d,type='sine',g=.15,slide=0,when=0){if(AU.muted)return;const c=ac(),t=c.currentTime+when,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(AU.sfxBus||AU.master);o.start(t);o.stop(t+d+.02);}
function noiseBuf(c,d){const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;return b;}
function noise(d,fq,g=.1,type='lowpass',when=0){if(AU.muted)return;const c=ac(),t=c.currentTime+when,s=c.createBufferSource();s.buffer=noiseBuf(c,d);const f=c.createBiquadFilter();f.type=type;f.frequency.value=fq;const v=c.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(v);v.connect(AU.sfxBus||AU.master);s.start(t);s.stop(t+d);}
const SFX={
  select:()=>beep(620,.05,'square',.08),
  confirm:()=>{beep(760,.07,'square',.1);beep(1140,.09,'square',.09,0,.06);},
  step:()=>noise(.05,420,.05+Math.random()*.02),
  heart:()=>{beep(52,.14,'sine',.5);beep(46,.16,'sine',.42,0,.22);},
  glitch:()=>{for(let i=0;i<5;i++){beep(200+Math.random()*1400,.04,'square',.07,600,i*.09);noise(.06,3000+Math.random()*3000,.08,'bandpass',i*.09);}},
  boom:()=>{noise(1.1,90,.5);beep(38,.9,'sine',.5,-14);noise(.25,500,.15,'lowpass',.02);},
  vortexF:()=>{if(AU.muted)return;beep(140,1.6,'sawtooth',.09,860);noise(1.6,900,.07,'bandpass');beep(880,.5,'sine',.08,500,1.2);},
  vortexR:()=>{if(AU.muted)return;beep(980,1.5,'sawtooth',.09,-820);noise(1.5,700,.08,'bandpass');beep(120,.5,'square',.09,-60,1.1);},
  chime:()=>{[440,554.4,659.3,880].forEach((f,i)=>beep(f,.9,'sine',.12,0,i*.16));},
  flash:()=>noise(.3,2500,.12,'highpass'),
};
function stopAmb(){AU.amb.forEach(n=>{try{n.g.gain.linearRampToValueAtTime(.0001,ac().currentTime+.6);n.s.forEach(s=>{try{s.stop(ac().currentTime+.7)}catch(e){}});}catch(e){}});AU.amb=[];}
function ambNode(make){if(AU.muted)return;const c=ac(),g=c.createGain();g.gain.value=0;g.connect(AU.ambBus||AU.master);const srcs=make(c,g);g.gain.linearRampToValueAtTime(1,c.currentTime+1.2);const nodes={g,s:srcs};AU.amb.push(nodes);srcs.forEach(s=>{try{s.start()}catch(e){}});}
function setAmbience(kind){stopAmb();ambSet=kind;setSong(kind?AMB_SONG[kind]||'':'');duckMusic(kind?1:0,kind?.8:.5);if(AU.muted||!AU.ctx||!kind)return;
  if(kind==='2088'||kind==='title'){ambNode((c,g)=>{const s=c.createBufferSource();s.buffer=noiseBuf(c,3);s.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=320;const l=c.createOscillator();l.frequency.value=.13;const lg=c.createGain();lg.gain.value=140;l.connect(lg);lg.connect(f.frequency);l.start();const v=c.createGain();v.gain.value=.05;s.connect(f);f.connect(v);v.connect(g);return[s,l];});}
  if(kind==='1944'){ambNode((c,g)=>{const s=c.createBufferSource();s.buffer=noiseBuf(c,3);s.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=130;const v=c.createGain();v.gain.value=.09;s.connect(f);f.connect(v);v.connect(g);return[s];});}
  if(kind==='1968'){ambNode((c,g)=>{const o=c.createOscillator();o.type='sine';o.frequency.value=55;const v=c.createGain();v.gain.value=.035;o.connect(v);v.connect(g);const s=c.createBufferSource();s.buffer=noiseBuf(c,2);s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=780;const v2=c.createGain();v2.gain.value=.016;s.connect(f);f.connect(v2);v2.connect(g);return[o,s];});}
  if(kind==='1999'){ambNode((c,g)=>{const os=[220,329.6,440].map(fr=>{const o=c.createOscillator();o.type='triangle';o.frequency.value=fr*(1+(Math.random()-.5)*.004);const v=c.createGain();v.gain.value=.028;o.connect(v);v.connect(g);return o;});const l=c.createOscillator();l.frequency.value=.3;const lg=c.createGain();lg.gain.value=.012;l.connect(lg);lg.connect(g.gain);l.start();return[...os,l];});}
}

/* ============================================================
   MUSIK PROSEDURAL — sequencer leitmotif "Hearts Across Time"
   Track: pad / bass / musicbox / bell / tick, dijadwalkan lookahead.
   Lembar soal sama, aransemen beda per era (teknik leitmotif):
   title=kotak musik Am • 1944=drone tritone • 1968=pulse mata-mata
   1999=bel arpeggio Am9 • true end=motif yang sama → resolusi C mayor
   ============================================================ */
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function NF(s){const m=s.match(/^([A-G][#b]?)(\d)$/);return 440*Math.pow(2,(NOTE[m[1]]+12*(+m[2]+1)-69)/12);}
function arpEv(start,notes,gap,dur,vel=.8){const seq=notes.concat(notes.slice(1,-1).reverse());return seq.map((n,i)=>[start+i*gap,n,dur,vel]);}
const MELODI=[ // leitmotif (16 langkah/bar, 8 bar)
  [0,'A4',6],[6,'C5',3],[10,'E5',6],[16,'D5',6],[22,'C5',3],[26,'B4',6],
  [32,'A4',4],[36,'B4',3],[40,'C5',3],[44,'D5',6],[48,'E5',12],
  [64,'F5',6],[70,'E5',3],[74,'D5',3],[78,'C5',6],[80,'D5',6],[86,'E5',3],[90,'C5',3],[94,'A4',6],
  [96,'B4',6],[102,'G4',3],[106,'E4',6],[112,'A4',16],[112,'A5',14,.7]];
const SONGS={
  theme:{bpm:74,len:128,tracks:[ // judul & 2088 — kotak musik melankolis
    {v:'pad',ev:[[0,['A3','C4','E4'],16],[16,['G3','B3','D4'],16],[32,['A3','C4','E4'],16],[48,['E3','G#3','B3'],16],[64,['F3','A3','C4'],16],[80,['C3','E3','G3'],16],[96,['E3','G#3','B3'],16],[112,['A3','C4','E4'],16]]},
    {v:'bass',ev:[[0,'A2',16],[16,'G2',16],[32,'A2',16],[48,'E2',16],[64,'F2',16],[80,'C3',16],[96,'E2',16],[112,'A2',16]]},
    {v:'musicbox',ev:MELODI}]},
  war:{bpm:62,len:128,tracks:[ // 1944 — drone rendah + tritone Eb (ketegangan)
    {v:'pad',ev:[[0,['A2','E3'],28],[32,['A2','E3'],28],[64,['F2','C3'],28],[96,['D#2','A#2'],30]]},
    {v:'bass',ev:[[0,'A1',24],[32,'A1',24],[64,'F1',24],[96,'D#2',26]]},
    {v:'bell',ev:[[16,'D5',8,.55],[48,'A4',8,.55],[80,'D#5',8,.6],[112,'E5',10,.65]]}]},
  spy:{bpm:92,len:128,tracks:[ // 1968 — pulse bass mata-mata + frasa motif
    {v:'bass',ev:(()=>{const roots=['A2','A2','F2','G2','A2','A2','F2','E2'],e=[];roots.forEach((r,i)=>{const b=i*16,r3=r.replace('2','3');e.push([b,r,2],[b+4,r,2],[b+8,r3,2],[b+12,r,2]);});return e;})()},
    {v:'pad',ev:[[0,['A3','C4','E4'],30],[32,['F3','A3','C4'],14],[48,['G3','B3','D4'],14],[64,['A3','C4','E4'],30],[96,['F3','A3','C4'],14],[112,['E3','G#3','B3'],14]]},
    {v:'tick',ev:(()=>{const e=[];for(let i=0;i<64;i++)e.push([i*2,'x',1,i%8===4?.8:.45]);return e;})()},
    {v:'musicbox',ev:[[32,'C5',4,.7],[38,'B4',4,.7],[96,'B4',6,.7],[104,'G#4',6,.7]]}]},
  cryo:{bpm:66,len:128,tracks:[ // 1999 — bel Am9 arpeggio berkilau
    {v:'bell',ev:[...arpEv(0,['A4','C5','E5','G5','B5'],2,4),...arpEv(16,['A4','C5','E5','G5','B5'],2,4),...arpEv(32,['F4','A4','C5','E5','G5'],2,4),...arpEv(48,['C4','E4','G4','B4','D5'],2,4),...arpEv(64,['A4','C5','E5','G5','B5'],2,4),...arpEv(80,['A4','C5','E5','G5','B5'],2,4),...arpEv(96,['F4','A4','C5','E5','G5'],2,4),...arpEv(112,['E4','G#4','B4','E5','G#5'],2,4)]},
    {v:'pad',ev:[[0,['A2','E3','B3'],30],[32,['F2','C3','A3'],30],[64,['A2','E3','B3'],30],[96,['E2','B2','G#3'],30]]},
    {v:'bass',ev:[[0,'A1',30],[32,'F2',30],[64,'A1',30],[96,'E2',30]]}]},
  end:{bpm:76,len:128,dbl:true,tracks:[ // true ending — motif yang sama, C mayor, hangat
    {v:'pad',ev:[[0,['A3','C4','E4'],16],[16,['F3','A3','C4'],16],[32,['C3','E3','G3'],16],[48,['G2','B2','D3'],16],[64,['F3','A3','C4'],16],[80,['C3','E3','G3'],16],[96,['G2','B2','D3'],16],[112,['C3','E3','G3'],16]]},
    {v:'bass',ev:[[0,'A2',16],[16,'F2',16],[32,'C3',16],[48,'G2',16],[64,'F2',16],[80,'C3',16],[96,'G2',16],[112,'C3',16]]},
    {v:'musicbox',ev:MELODI}]},
};
const AMB_SONG={'title':'theme','2088':'theme','1944':'war','1968':'spy','1999':'cryo'};
const MUS={name:'',song:null,map:null,step:0,nextT:0};
function buildMap(s){const m={};s.tracks.forEach(tr=>tr.ev.forEach(e=>{(m[e[0]]=m[e[0]]||[]).push({v:tr.v,notes:Array.isArray(e[1])?e[1]:[e[1]],dur:e[2]||6,vel:e[3]||1});}));return m;}
function setSong(nm){if(MUS.name===nm)return;MUS.name=nm;MUS.song=SONGS[nm]||null;MUS.map=MUS.song?buildMap(MUS.song):null;MUS.step=0;if(AU.ctx)MUS.nextT=AU.ctx.currentTime+.06;}
function duckMusic(level,rel){if(!AU.ctx||!AU.musBus)return;const t=AU.ctx.currentTime;try{AU.musBus.gain.cancelScheduledValues(t);AU.musBus.gain.setValueAtTime(AU.musBus.gain.value,t);AU.musBus.gain.linearRampToValueAtTime(.8*level,t+(rel||.4));}catch(e){}}
function vMusicbox(f,t,g){const c=AU.ctx;[[1,1],[3.98,.16],[6.1,.05]].forEach(([r,a])=>{const o=c.createOscillator();o.type='sine';o.frequency.value=f*r;const og=c.createGain();og.gain.setValueAtTime(g*a,t);og.gain.exponentialRampToValueAtTime(.0001,t+1.4/Math.sqrt(r));o.connect(og);og.connect(AU.mIn);o.start(t);o.stop(t+1.5);});}
function vBell(f,t,g){const c=AU.ctx;const car=c.createOscillator();car.type='sine';car.frequency.value=f;const mod=c.createOscillator();mod.type='sine';mod.frequency.value=f*2.4;const mg=c.createGain();mg.gain.setValueAtTime(f*1.6,t);mg.gain.exponentialRampToValueAtTime(f*.02,t+1.1);mod.connect(mg);mg.connect(car.frequency);const bg=c.createGain();bg.gain.setValueAtTime(g,t);bg.gain.exponentialRampToValueAtTime(.0001,t+2.2);car.connect(bg);bg.connect(AU.mIn);car.start(t);mod.start(t);car.stop(t+2.3);mod.stop(t+2.3);}
function vPad(f,t,dur,g){const c=AU.ctx;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=850;const vg=c.createGain();vg.gain.setValueAtTime(.0001,t);vg.gain.linearRampToValueAtTime(g,t+.5);vg.gain.setValueAtTime(g,t+dur*.6);vg.gain.linearRampToValueAtTime(.0001,t+dur);lp.connect(vg);vg.connect(AU.mIn);[-4,4].forEach(d2=>{const o=c.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=d2;o.connect(lp);o.start(t);o.stop(t+dur+.1);});}
function vBass(f,t,dur,g){const c=AU.ctx;const o=c.createOscillator();o.type='triangle';o.frequency.value=f;const o2=c.createOscillator();o2.type='sine';o2.frequency.value=f*2;const g2=c.createGain();g2.gain.value=.35;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;const bg=c.createGain();bg.gain.setValueAtTime(.0001,t);bg.gain.linearRampToValueAtTime(g,t+.02);bg.gain.setValueAtTime(g*.7,t+dur*.7);bg.gain.linearRampToValueAtTime(.0001,t+dur);o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(bg);bg.connect(AU.mIn);o.start(t);o.stop(t+dur+.05);o2.start(t);o2.stop(t+dur+.05);}
function vTick(t,g){const c=AU.ctx;const s=c.createBufferSource();s.buffer=noiseBuf(c,.02);const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const tg=c.createGain();tg.gain.setValueAtTime(g,t);tg.gain.exponentialRampToValueAtTime(.0001,t+.03);s.connect(f);f.connect(tg);tg.connect(AU.mIn);s.start(t);}
function musTick(){const c=AU.ctx;if(!c||!MUS.song||AU.muted)return;if(!MUS.nextT||MUS.nextT<c.currentTime-.5)MUS.nextT=c.currentTime+.05;const s=MUS.song,spb=60/s.bpm/4;
  while(MUS.nextT<c.currentTime+.16){const evs=MUS.map[MUS.step];
    if(evs)evs.forEach(e=>{const t=MUS.nextT,spbDur=e.dur*spb,g=.26*e.vel;e.notes.forEach(n=>{
      if(e.v==='tick'){vTick(t,g*.5);return;}
      const f=NF(n);
      if(e.v==='pad')vPad(f,t,spbDur+.15,g*.5);
      else if(e.v==='bass')vBass(f,t,spbDur,g);
      else if(e.v==='bell')vBell(f,t,g);
      else if(e.v==='tick')vTick(t,g*.5);
      else{vMusicbox(f,t,g);if(s.dbl)vBell(f*2,t,g*.35);}});});
    MUS.step=(MUS.step+1)%s.len;MUS.nextT+=spb;}}
setInterval(musTick,42);

/* ---------- Input ---------- */
const keys={},pressed={};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key))e.preventDefault();if(!keys[e.key])pressed[e.key]=true;keys[e.key]=true;initAudioOnce();});
addEventListener('keyup',e=>{keys[e.key]=false;});
let ptr={x:0,y:0,down:false,tap:false};
function cvXY(e){const r=cv.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left,cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return{x:cx/r.width*W,y:cy/r.height*H};}
function pdown(e){e.preventDefault();const p=cvXY(e);ptr.x=p.x;ptr.y=p.y;ptr.down=true;ptr.tap=true;initAudioOnce();}
function pmove(e){if(e.touches)e.preventDefault();const p=cvXY(e);ptr.x=p.x;ptr.y=p.y;}
function pup(){ptr.down=false;}
cv.addEventListener('mousedown',pdown);cv.addEventListener('mousemove',pmove);addEventListener('mouseup',pup);
cv.addEventListener('touchstart',pdown,{passive:false});cv.addEventListener('touchmove',pmove,{passive:false});addEventListener('touchend',pup);
let audioInited=false;
function initAudioOnce(){if(audioInited)return;audioInited=true;ac();}
function keyOnce(k){if(pressed[k]){pressed[k]=false;return true;}return false;}
const advHit=()=>keyOnce(' ')||keyOnce('Enter')||keyOnce('Spacebar');

/* ============================================================
   ASSET PIPELINE — PNG opsional, fallback otomatis ke prosedural
   • Karakter: spritesheet 4 kolom (frame jalan) × 8 baris (ekspresi,
     urutan EXPR_ROWS). Jangkar: tengah-bawah (kaki di y=0).
   • Latar: gambar tile horizontal seamless, jangkar bawah,
     faktor parallax sama dengan versi prosedural.
   • Semua aset OPSIONAL — file hilang/404 => game tetap jalan
     memakai gambar prosedural. Bisa mengganti sebagian saja.
   • Pixel art? tambahkan  pixel:true  pada entri manifest.
   ============================================================ */
const EXPR_ROWS=['neutral','smile','sad','shock','angry','mad','warm','happy'];
const ASSET_MANIFEST={
  elena:{src:'assets/elena_sheet.png',fw:150,fh:210,h:112},
  arthur_muda:{src:'assets/arthur_muda_sheet.png',fw:150,fh:210,h:112},
  arthur_dewasa:{src:'assets/arthur_dewasa_sheet.png',fw:150,fh:210,h:112},
  arthur_buron:{src:'assets/arthur_buron_sheet.png',fw:150,fh:210,h:112},
  arthur_tua:{src:'assets/arthur_tua_sheet.png',fw:150,fh:210,h:112},
  bg2088_far:{src:'assets/bg2088_far.png'},bg2088_mid:{src:'assets/bg2088_mid.png'},bg2088_near:{src:'assets/bg2088_near.png'},
  bg1944_far:{src:'assets/bg1944_far.png'},bg1944_mid:{src:'assets/bg1944_mid.png'},
  bg1968A_far:{src:'assets/bg1968A_far.png'},bg1968A_mid:{src:'assets/bg1968A_mid.png'},
  bg1968B_far:{src:'assets/bg1968B_far.png'},bg1968B_mid:{src:'assets/bg1968B_mid.png'},
  bg1999_far:{src:'assets/bg1999_far.png'},bg1999_mid:{src:'assets/bg1999_mid.png'},
};
const AS={imgs:{},ok:{},total:0,done:0,ready:false};
(function loadAssets(){ // mulai dimuat saat halaman dibuka; layar 'load' menunggu
  const list=Object.entries(ASSET_MANIFEST);AS.total=list.length;
  if(!list.length){AS.ready=true;return;}
  let fin=0;const end=()=>{AS.done=++fin;if(fin>=list.length)AS.ready=true;};
  list.forEach(([id,cfg])=>{const im=new Image();
    im.onload=()=>{AS.imgs[id]=im;AS.ok[id]=true;end();};
    im.onerror=()=>{AS.ok[id]=false;end();}; // fallback prosedural
    im.src=cfg.src;});
})();
function drawCharSheet(c,id,expr,phase,moving,opt={}){ // false => pemanggil pakai prosedural
  const cfg=ASSET_MANIFEST[id],im=AS.imgs[id];if(!im||!cfg||!im.width)return false;
  const cols=Math.max(1,Math.floor(im.width/cfg.fw)),rows=Math.max(1,Math.floor(im.height/cfg.fh));
  let row=EXPR_ROWS.indexOf(expr);if(row<0||row>=rows)row=0;
  let col=0;if(moving&&cols>1)col=Math.floor(phase/(Math.PI/2))%cols;
  const s=(cfg.h||112)/cfg.fh,dw=cfg.fw*s,dh=cfg.fh*s;
  if(opt.tremble)c.translate(Math.sin(T*31)*.9,0);
  if(cfg.pixel){c.save();c.imageSmoothingEnabled=false;}
  c.drawImage(im,col*cfg.fw,row*cfg.fh,cfg.fw,cfg.fh,-dw/2,-dh,dw,dh);
  if(cfg.pixel)c.restore();
  return true;
}
function drawVialOverlay(c,cfg){ // serum di tangan tetap digambar di atas sheet
  const s=(cfg.h||112)/cfg.fh,dw=cfg.fw*s,dh=cfg.fh*s;
  c.save();c.translate(dw*.13,-dh*.44);c.fillStyle=PAL.vialB;c.shadowColor=PAL.vialB;c.shadowBlur=10;rr(c,-2.6,-7,5.2,10,2.4);c.fill();c.shadowBlur=0;outline(c,1.4);rr(c,-2.6,-7,5.2,10,2.4);c.stroke();c.restore();}
function bgLayerImg(c,id,factor,camX){ // tile horizontal, jangkar bawah; false => prosedural
  const im=AS.imgs[id];if(!im||!im.width)return false;
  const iw=im.width,ih=im.height,off=-((camX*factor)%iw);
  for(let x=off;x<W;x+=iw)c.drawImage(im,x,H-ih);
  return true;
}

function outline(c=ctx,w=2.5){c.strokeStyle=PAL.line;c.lineWidth=w;c.lineJoin='round';c.lineCap='round';}
// mata + ekspresi (pandangan 3/4 ke arah facing)
function drawFace(c,expr,blink,t,col=PAL.eye,blush=false){
  const eyeH=(expr==='shock'||expr==='mad')?5.2:expr==='closed'?0.6:3.4;
  const drawEye=(dx)=>{
    c.fillStyle='#FFF';rr(c,dx-4.4,-4.6,8.8,9.2,4.2);c.fill();
    c.fillStyle=col;
    if(blink||expr==='closed'){c.fillRect(dx-3.6,.2,7.2,1.4);}
    else if(expr==='happy'){c.beginPath();c.arc(dx,0,3.6,Math.PI,0);c.fill();}
    else{rr(c,dx-2.6,-eyeH*.4+1.6,5.2,eyeH+2,2.5);c.fill();
      c.fillStyle='#FFF';c.beginPath();c.arc(dx+1.1,-eyeH*.4+2,1.3,0,TAU);c.fill();}
    outline(c,1.6);rr(c,dx-4.4,-4.6,8.8,9.2,4.2);c.stroke();
  };
  drawEye(-7.4);drawEye(7.4);
  // alis
  c.strokeStyle=PAL.line;c.lineWidth=1.8;
  const brow=(dx,a)=>{c.save();c.translate(dx,-8.4);c.rotate(a);c.beginPath();c.moveTo(-3.4,0);c.quadraticCurveTo(0,-1.6,3.4,0);c.stroke();c.restore();};
  if(expr==='angry'||expr==='mad'){brow(-7.4,.38);brow(7.4,-.38);}
  else if(expr==='sad'){brow(-7.4,-.3);brow(7.4,.3);}
  else{brow(-7.4,-.08);brow(7.4,.08);}
  // mulut
  c.strokeStyle=PAL.line;c.lineWidth=1.8;c.beginPath();
  const my=9.4;
  if(expr==='smile'||expr==='happy'||expr==='warm'){c.moveTo(-3,my-1.4);c.quadraticCurveTo(0,my+2.4,3,my-1.4);}
  else if(expr==='sad'){c.moveTo(-3,my+1.6);c.quadraticCurveTo(0,my-1.6,3,my+1.6);}
  else if(expr==='shock'){c.moveTo(-2.2,my-.4);c.arc(0,my-.4,2.3,0,TAU);}
  else if(expr==='mad'){c.moveTo(-3.6,my+1);for(let i=-2.4;i<=2.6;i+=1.6)c.lineTo(i,my+(i%3.2<1.6?-1:1));}
  else{c.moveTo(-2.4,my);c.lineTo(2.4,my);}
  c.stroke();
  if(blush){c.fillStyle='rgba(226,120,110,.4)';c.beginPath();c.ellipse(-10.6,5.6,3,1.7,0,0,TAU);c.ellipse(10.6,5.6,3,1.7,0,0,TAU);c.fill();}
  if(expr==='sad'){const ty=6.5+((t*7)%6);c.fillStyle='rgba(150,200,235,.85)';c.beginPath();c.ellipse(11.6,ty,1.5,2.3,0,0,TAU);c.fill();}
  if(expr==='shock'){c.fillStyle='rgba(150,205,240,.9)';c.beginPath();c.ellipse(-12.4,-5.5+(t*5)%3,1.6,2.4,.3,0,TAU);c.fill();}
}
function limb(c,x1,y1,x2,y2,w,col){c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();outline(c,1.4);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function groundShadow(c,w=1,a=.28){const g=c.createRadialGradient(0,0,2,0,0,26);g.addColorStop(0,`rgba(10,8,6,${a})`);g.addColorStop(1,'rgba(10,8,6,0)');c.save();c.translate(0,4);c.scale(w,.3);c.fillStyle=g;c.beginPath();c.arc(0,0,26,0,TAU);c.fill();c.restore();}

/* --- ELENA (rekonstruksi desain referensi: pirang bergelombang, jas lab longgar terbuka, gaun merah, boot strap) --- */
function drawElena(c,t,phase,moving,expr='neutral',opt={}){
  if(drawCharSheet(c,'elena',expr,phase,moving,opt)){if(opt.vial)drawVialOverlay(c,ASSET_MANIFEST.elena);return;}
  const bob=moving?Math.abs(Math.sin(phase))*2.6:Math.sin(t*2)*0.9;
  const sw=moving?Math.sin(phase):Math.sin(t*1.4)*.1;
  const sway=moving?Math.sin(phase)*.05:Math.sin(t*1.3)*.018; // fisika rambut/gaun sederhana
  c.save();c.translate(0,-bob);
  if(moving&&opt.lean)c.rotate(opt.lean); // condong maju saat melangkah
  // rambut belakang panjang bergelombang (di belakang badan, ujung scallop) — ikut ayun langkah
  c.save();c.rotate(sway*.7);c.translate(0,-62);
  c.fillStyle=PAL.hairEs;c.beginPath();
  c.moveTo(-21,-16);
  c.quadraticCurveTo(-25,4,-24,32);
  c.quadraticCurveTo(-24,40,-19,34);c.quadraticCurveTo(-17,44,-11,38);c.quadraticCurveTo(-8,48,-2,40);
  c.quadraticCurveTo(2,50,8,40);c.quadraticCurveTo(12,46,17,36);c.quadraticCurveTo(21,42,24,32);
  c.quadraticCurveTo(25,4,21,-16);
  c.quadraticCurveTo(18,-24,0,-24);c.quadraticCurveTo(-18,-24,-21,-16);c.closePath();c.fill();
  outline(c,2.6);c.stroke();
  c.strokeStyle=PAL.hairE;c.lineWidth=1.8; // garis gelombang dalam rambut
  c.beginPath();c.moveTo(-17,6);c.quadraticCurveTo(-15,18,-17,30);c.moveTo(17,6);c.quadraticCurveTo(15,18,17,30);c.moveTo(0,-14);c.quadraticCurveTo(-2,8,0,30);c.stroke();
  c.restore();
  // kaki
  const l1=sw*9,l2=-sw*9;
  limb(c,-4,-24,-4+l1,-4,6.5,PAL.skin);limb(c,4,-24,4+l2,-4,6.5,PAL.skin);
  // boot kulit mid-calf + tali strap (referensi)
  const boot=(lx)=>{c.save();c.translate(lx,0);c.fillStyle=PAL.boot;rr(c,-5.8,-19,11.6,19.4,3.6);c.fill();outline(c,2.4);rr(c,-5.8,-19,11.6,19.4,3.6);c.stroke();
    c.fillStyle=PAL.bootS;rr(c,-5.8,-12,11.6,3,1.2);c.fill(); // strap band
    c.fillStyle='#D9B25E';c.beginPath();c.arc(0,-10.5,1.3,0,TAU);c.fill(); // buckle
    c.strokeStyle=PAL.bootS;c.lineWidth=1.2;c.beginPath();c.moveTo(-4.4,-2);c.lineTo(4.4,-2);c.stroke();c.restore();};
  boot(-4+l1);boot(4+l2);
  // gaun merah A-line sleeveless (terlihat di celah jas terbuka) — ujuran ikut ayun langkah
  const hsw=sw*6;
  c.fillStyle=PAL.dress;c.beginPath();c.moveTo(-9,-52);c.lineTo(9,-52);c.lineTo(13+hsw,-25);c.lineTo(-13+hsw,-25);c.closePath();c.fill();
  c.fillStyle=PAL.dressS;c.beginPath();c.moveTo(3,-52);c.lineTo(9,-52);c.lineTo(13+hsw,-25);c.lineTo(6+hsw,-25);c.closePath();c.fill();
  outline(c,2.6);c.beginPath();c.moveTo(-9,-52);c.lineTo(9,-52);c.lineTo(13+hsw,-25);c.lineTo(-13+hsw,-25);c.closePath();c.stroke();
  c.strokeStyle='rgba(255,220,220,.5)';c.lineWidth=1.6;c.beginPath();c.moveTo(-13+hsw,-26.6);c.lineTo(13+hsw,-26.6);c.stroke();
  // lengan belakang jas — longgar, melebar di pergelangan (referensi)
  c.fillStyle=PAL.coatS;c.beginPath();
  c.moveTo(-8,-51);c.lineTo(-15-sw*4,-37);c.lineTo(-8-sw*4,-33.6);c.lineTo(-2.5,-48.6);c.closePath();c.fill();
  outline(c,2.2);c.beginPath();c.moveTo(-8,-51);c.lineTo(-15-sw*4,-37);c.lineTo(-8-sw*4,-33.6);c.lineTo(-2.5,-48.6);c.closePath();c.stroke();
  c.fillStyle=PAL.skin;c.beginPath();c.arc(-11.5-sw*4,-33.6,3.1,0,TAU);c.fill();outline(c,1.6);c.stroke();
  // jas lab terbuka: dua panel kiri-kanan, gaun merah mengintip di tengah
  c.fillStyle=PAL.coat;
  c.beginPath();c.moveTo(-12,-56);c.lineTo(-3,-47);c.lineTo(-4,-26);c.lineTo(-14,-26);c.closePath();c.fill();
  c.beginPath();c.moveTo(12,-56);c.lineTo(3,-47);c.lineTo(4,-26);c.lineTo(14,-26);c.closePath();c.fill();
  outline(c,2.8);
  c.beginPath();c.moveTo(-12,-56);c.lineTo(-3,-47);c.lineTo(-4,-26);c.lineTo(-14,-26);c.closePath();c.stroke();
  c.beginPath();c.moveTo(12,-56);c.lineTo(3,-47);c.lineTo(4,-26);c.lineTo(14,-26);c.closePath();c.stroke();
  c.strokeStyle=PAL.coatS;c.lineWidth=1.5; // lipitan dalam panel
  c.beginPath();c.moveTo(-9.6,-50);c.lineTo(-11,-28);c.moveTo(9.6,-50);c.lineTo(11,-28);c.stroke();
  // kerah jas V kecil
  c.fillStyle=PAL.coatS;c.beginPath();c.moveTo(-6,-56);c.lineTo(0,-50.5);c.lineTo(-8.5,-52.5);c.closePath();c.fill();
  c.beginPath();c.moveTo(6,-56);c.lineTo(0,-50.5);c.lineTo(8.5,-52.5);c.closePath();c.fill();
  // lengan depan jas — longgar melebar + manset
  const fx=11.5+sw*4;
  c.fillStyle=PAL.coat;c.beginPath();
  c.moveTo(8,-51);c.lineTo(fx+3.5,-37);c.lineTo(fx-3.5,-33.6);c.lineTo(2.5,-48.6);c.closePath();c.fill();
  outline(c,2.2);c.beginPath();c.moveTo(8,-51);c.lineTo(fx+3.5,-37);c.lineTo(fx-3.5,-33.6);c.lineTo(2.5,-48.6);c.closePath();c.stroke();
  c.strokeStyle=PAL.coatS;c.lineWidth=1.5;c.beginPath();c.moveTo(fx+3.4,-37.4);c.lineTo(fx-3.4,-34);c.stroke(); // manset
  c.fillStyle=PAL.skin;c.beginPath();c.arc(fx,-33.4,3.1,0,TAU);c.fill();outline(c,1.6);c.stroke();
  if(opt.vial){ // vial serum biru (ending)
    c.save();c.translate(fx,-31);
    c.fillStyle=PAL.vialB;c.shadowColor=PAL.vialB;c.shadowBlur=10;rr(c,-2.6,-7,5.2,10,2.4);c.fill();c.shadowBlur=0;outline(c,1.4);rr(c,-2.6,-7,5.2,10,2.4);c.stroke();c.restore();}
  // kepala
  c.save();c.translate(0,-56);c.rotate(moving?Math.sin(phase)*.02:Math.sin(t*1.6)*.012);
  // wajah
  c.fillStyle=PAL.skin;c.beginPath();c.ellipse(0,-6,17.5,16.5,0,0,TAU);c.fill();outline(c,2.6);c.stroke();
  // poni bergelombang 5 helai + kilau
  c.fillStyle=PAL.hairE;c.beginPath();
  c.moveTo(-18,-8);c.quadraticCurveTo(-17,-25,0,-25);c.quadraticCurveTo(17,-25,18,-8);
  c.quadraticCurveTo(14,-15,10,-9.5);c.quadraticCurveTo(7,-17,2,-10.5);c.quadraticCurveTo(-1,-18,-6,-10.5);c.quadraticCurveTo(-10,-16,-13,-9.5);c.quadraticCurveTo(-15,-13,-18,-8);
  c.closePath();c.fill();outline(c,2.2);c.stroke();
  c.fillStyle='rgba(255,247,220,.5)';c.beginPath();c.ellipse(-5.5,-18.5,7.5,2.3,-.22,0,TAU);c.fill();
  // side lock bergelombang S di pelipis
  c.fillStyle=PAL.hairE;
  c.beginPath();c.moveTo(-17.5,-12);c.quadraticCurveTo(-21,-2,-17.5,8);c.quadraticCurveTo(-15,12,-13.5,8);c.quadraticCurveTo(-16,0,-14.5,-9);c.closePath();c.fill();outline(c,2);c.stroke();
  c.beginPath();c.moveTo(17.5,-12);c.quadraticCurveTo(21,-2,17.5,8);c.quadraticCurveTo(15,12,13.5,8);c.quadraticCurveTo(16,0,14.5,-9);c.closePath();c.fill();outline(c,2);c.stroke();
  c.save();c.translate(0,-6);drawFace(c,expr,(T%3.7)<.12,t,PAL.eye,expr==='warm'||expr==='happy');c.restore();
  c.restore();
  c.restore();
}

/* --- ARTHUR (muda 1944 / dewasa 1968 / buron / tua 1999) --- */
function drawArthur(c,kind,t,expr='neutral',opt={}){
  if(drawCharSheet(c,'arthur_'+kind,expr,0,false,opt))return;
  const tremble=(kind==='muda'||opt.tremble)?Math.sin(t*31)*.9:0;
  const bob=Math.sin(t*1.7)*.8;const old=kind==='tua';
  c.save();c.translate(tremble,-bob+(old?2:0));
  if(old){c.rotate(-.06);} // bungkuk
  // kaki
  c.strokeStyle=old?PAL.pants:(kind==='muda'?PAL.uniOliveS:PAL.pants);c.lineWidth=7;c.lineCap='round';
  c.beginPath();c.moveTo(-4,-24);c.lineTo(-4.6,-4);c.moveTo(4,-24);c.lineTo(4.6,-4);c.stroke();outline(c,1.5);c.beginPath();c.moveTo(-4,-24);c.lineTo(-4.6,-4);c.moveTo(4,-24);c.lineTo(4.6,-4);c.stroke();
  c.fillStyle='#3A3430';[[-4.6],[4.6]].forEach(([lx])=>{rr(c,lx-5.4,-7,10.8,7.6,2.6);c.fill();outline(c,1.6);rr(c,lx-5.4,-7,10.8,7.6,2.6);c.stroke();});
  if(kind==='muda'){c.strokeStyle='#7d6a4d';c.lineWidth=1.2;[-4.6,4.6].forEach(lx=>{c.beginPath();c.moveTo(lx-3,-14);c.lineTo(lx+3,-14);c.moveTo(lx-3,-10.6);c.lineTo(lx+3,-10.6);c.stroke();});}
  // badan
  const bodyCol=kind==='muda'?PAL.uniOlive:kind==='buron'?PAL.jacket:kind==='tua'?PAL.cardigan:PAL.coat;
  const bodyS  =kind==='muda'?PAL.uniOliveS:kind==='buron'?'#57462f':kind==='tua'?'#8E8168':PAL.coatS;
  c.fillStyle=bodyCol;rr(c,-11,-55,22,32,6);c.fill();outline(c,2.8);rr(c,-11,-55,22,32,6);c.stroke();
  c.fillStyle=bodyS;rr(c,2,-55,9,32,6);c.fill();
  if(kind==='dewasa'){c.fillStyle=PAL.labBlue;c.beginPath();c.moveTo(-3.6,-53);c.lineTo(3.6,-53);c.lineTo(3,-25);c.lineTo(-3,-25);c.closePath();c.fill();}
  if(kind==='tua'){c.fillStyle=PAL.shirtOld;c.beginPath();c.moveTo(-4,-53);c.lineTo(4,-53);c.lineTo(3,-25);c.lineTo(-3,-25);c.closePath();c.fill();}
  if(kind==='buron'){c.strokeStyle='#4a3b26';c.lineWidth=2.4;c.beginPath();c.moveTo(-9,-52);c.lineTo(9,-40);c.stroke();} // tali satchel
  // lengan belakang
  limb(c,-8,-50,-11,-35,5.6,bodyS);
  // detail lengan
  if(kind==='muda'){ // ban lengan medic palang merah
    c.save();c.translate(-10.4,-41);c.fillStyle='#FFF';rr(c,-4.6,-4,9.2,8,2);c.fill();outline(c,1.6);rr(c,-4.6,-4,9.2,8,2);c.stroke();c.fillStyle='#C23B3B';c.fillRect(-1.2,-3.4,2.4,6.8);c.fillRect(-3.4,-1.2,6.8,2.4);c.restore();}
  // lengan depan + tangan
  const armX=old?4:9;
  if(old){ // tongkat
    limb(c,8,-50,12,-38,5.6,PAL.cardigan);
    c.strokeStyle=PAL.cane;c.lineWidth=3.4;c.beginPath();c.moveTo(12,-38);c.lineTo(14,0);c.stroke();outline(c,1.4);c.beginPath();c.moveTo(12,-38);c.lineTo(14,0);c.stroke();}
  else if(kind==='muda'){ // memegang tabung racun (gemetar)
    limb(c,8,-50,7,-37,5.6,bodyCol);
    c.fillStyle=PAL.skin;c.beginPath();c.arc(7,-36,3,0,TAU);c.fill();outline(c,1.4);c.stroke();
    c.save();c.translate(9,-40);
    c.fillStyle='rgba(159,230,112,.18)';c.beginPath();c.arc(0,3,13,0,TAU);c.fill();
    c.fillStyle=PAL.vialG;c.shadowColor=PAL.vialG;c.shadowBlur=9;rr(c,-3,-9,6,12,2.6);c.fill();c.shadowBlur=0;outline(c,1.5);rr(c,-3,-9,6,12,2.6);c.stroke();
    c.fillStyle='#FFF';c.beginPath();c.arc(-1,-4,1.1,0,TAU);c.fill();c.restore();}
  else{const ax2=10+Math.sin(t*1.6)*1.4;limb(c,8,-50,ax2,-36,5.6,bodyCol);c.fillStyle=PAL.skin;c.beginPath();c.arc(ax2,-35,3,0,TAU);c.fill();outline(c,1.4);c.stroke();}
  // kepala
  c.save();c.translate(old?4:0,-56);if(old)c.rotate(.05);
  c.fillStyle=PAL.skin;c.beginPath();c.ellipse(0,-6,17,16,0,0,TAU);c.fill();outline(c,2.8);c.stroke();
  // rambut per kind
  if(kind==='muda'){c.fillStyle=PAL.hairA;c.beginPath();c.moveTo(-17,-9);c.quadraticCurveTo(-15,-24,0,-23.4);c.quadraticCurveTo(15,-24,17,-9);c.quadraticCurveTo(8,-17,0,-16.4);c.quadraticCurveTo(-8,-17,-17,-9);c.closePath();c.fill();outline(c,2);c.stroke();
    // helm baja

function wrap(c,text,maxW){const words=text.split(' ');const lines=[];let cur='';for(const w of words){const test=cur?cur+' '+w:w;if(c.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;}if(cur)lines.push(cur);return lines;}

const D={node:null,ops:[],i:0,line:null,prog:0,choices:null,sel:0,choiceT:0,duckT:false,elExpr:'neutral',arExpr:'neutral',arKind:'muda',ended:false};
function startNode(id){const n=NODES[id];D.ops=(typeof n==='function')?n():n;D.i=0;D.node=id;D.line=null;D.choices=null;step();}
function step(){
  while(D.i<D.ops.length){
    const op=D.ops[D.i++];
    if(op.t==='say'){D.line=op;D.prog=0;
      if(op.who==='elena')D.elExpr=op.expr||'neutral';
      else if(op.who==='narrator'){}
      else D.arExpr=op.expr||'neutral';
      return;}
    if(op.t==='choice'){D.choices=op.opts;D.sel=0;D.line=null;D.choiceT=0;D.duckT=false;duckMusic(.5,.4);SFX.select();return;}
    if(op.t==='goto'){startNode(op.id);return;}
    if(op.t==='fx'){if(op.kind==='boom'){SFX.boom();G.shakeT=.9;G.shakeA=9;G.whiteFlash=1;}if(op.kind==='chime')SFX.chime();continue;}
    if(op.t==='vortex'){startVortex(op.to,false);return;}
    if(op.t==='ending'){if(op.kind==='loop')startGlitch();else startEndCard();return;}
  }
}
function dialogAdvance(){
  if(D.choices){const o=D.choices[D.sel];SFX.confirm();if(o.fx)o.fx();D.choices=null;startNode(o.goto);return;}
  if(D.line){if(D.prog<1){D.prog=1;return;}D.line=null;step();return;}
}
function updateDialog(dt,mx,my){
  if(D.line&&D.prog<1){D.prog=Math.min(1,D.prog+dt*30);if(Math.random()<.25)beep(900+Math.random()*500,.015,'square',.012);}
  // ducking musik: turun saat teks mengetik, naik lagi setelah selesai
  if(D.line&&D.prog<1&&!D.duckT){D.duckT=true;duckMusic(.55,.3);}
  if((!D.line||D.prog>=1)&&D.duckT){D.duckT=false;duckMusic(.85,1.2);}
  if(D.choices){D.choiceT=Math.min(1,D.choiceT+dt*4.5);
    if(keyOnce('ArrowUp')||keyOnce('w')){D.sel=(D.sel+D.choices.length-1)%D.choices.length;SFX.select();}
    if(keyOnce('ArrowDown')||keyOnce('s')){D.sel=(D.sel+1)%D.choices.length;SFX.select();}
    if(keyOnce('1')){D.sel=0;dialogAdvance();return;}
    if(keyOnce('2')&&D.choices&&D.choices.length>1){D.sel=1;dialogAdvance();return;}
    if(!D.choices)return;
    // hover
    let hov=-1;const bw=560,bh=D.choices.length*58+22,bx=(W-bw)/2,by=H-bh-24;
    D.choices.forEach((o,i)=>{const oy=by+14+i*58;if(mx>bx+10&&mx<bx+bw-10&&my>oy&&my<oy+52)hov=i;});
    if(hov>=0&&hov!==D.sel){D.sel=hov;SFX.select();}
    if(ptr.tap&&hov>=0){dialogAdvance();ptr.tap=false;}
    if(advHit())dialogAdvance();
  } else if(advHit()||ptr.tap){ptr.tap=false;dialogAdvance();}
}

/* ============================================================
   STATE: VORTEX / GLITCH / WALK / TITLE / ENDING
   ============================================================ */
const ERA_CONF={
  '1944':{amb:'1944',ar:'muda',node:'n_b1',cap:'BABAK 1 — GARIS DEPAN, 1944',from:1944},
  '1968':{amb:'1968',ar:null,node:'n_b2',cap:'BABAK 2 — 1968',from:1968},
  '1999':{amb:'1999',ar:'tua',node:'n_b3',cap:'BABAK 3 — RUANG OBSERVASI KAPSUL, 1999',from:1999}};
function startVortex(to,rewind){
  G.vortex={to,t:0,rewind,from:rewind?1999:(G.era==='2088'?2088:ERA_CONF[G.era].from)};
  G.state='vortex';setAmbience(null);rewind?SFX.vortexR():SFX.vortexF();
}
function startGlitch(){G.state='glitch';G.glitch={t:0};S.loop++;SFX.glitch();setAmbience(null);stopAmb();}
function startWalk(era){
  G.era=era;G.state='walk';const cfg=ERA_CONF[era];
  G.walk={era,len:1500,arX:1180,ar:era==='1968'?(S.routeB1==='A'?'buron':'dewasa'):cfg.ar,node:cfg.node,
    cap:era==='1968'?(S.routeB1==='A'?'BABAK 2 — BUNKER BAWAH TANAH, 1968':'BABAK 2 — LABORATORIUM MILITER, 1968'):cfg.cap};
  G.player.x=90;G.player.facingRight=true;G.caption=G.walk.cap;G.captionT=3.2;parts.length=0;
  setAmbience(cfg.amb);
}
function startEndCard(){G.state='endcard';G.endCard={t:0};SFX.chime();setAmbience('1999');setSong('end');duckMusic(1,1.2);}
function resetAll(){S.empathy=0;S.logic=0;S.routeB1='';S.routeB2='';S.loop=0;
  D.elExpr='neutral';D.arExpr='neutral';D.duckT=false;D.choiceT=0;parts.length=0;}

/* ---------- update per-state ---------- */
function update(dt){
  T+=dt;G.t+=dt;
  if(G.whiteFlash>0)G.whiteFlash-=dt*2.2;
  if(G.skyFlash>0)G.skyFlash-=dt*1.4;
  if(G.shakeT>0)G.shakeT-=dt;
  if(G.captionT>0)G.captionT-=dt;
  const mx=ptr.x,my=ptr.y;
  switch(G.state){
    case 'load':
      if(AS.ready)G.state='title';
      break;
    case 'title':
      setAmbOnce('title');
      if(advHit()||ptr.tap){ptr.tap=false;SFX.confirm();resetAll();G.state='prologue';G.fadeIn=1;startNode('prologue');setAmbience('2088');SFX.heart();}
      break;
    case 'prologue':
      if((T%2.4)<dt)SFX.heart();
      updateDialog(dt,mx,my);break;
    case 'walk':{
      setAmbOnce(ERA_CONF[G.era].amb);
      const p=G.player;let dir=0;
      if(keys['ArrowRight']||keys['d']||keys['D'])dir+=1;
      if(keys['ArrowLeft']||keys['a']||keys['A'])dir-=1;
      // tombol sentuh
      if(IS_TOUCH&&ptr.down){if(ptr.x>W-140&&ptr.y>H-130)dir=1;else if(ptr.x<140&&ptr.y>H-130)dir=-1;}
      const run=keys['Shift']?1.75:1;
      if(dir!==0){p.x=clamp(p.x+dir*150*run*dt,64,G.walk.len-40);p.moving=true;p.facingRight=dir>0;
        const old=p.phase;p.phase+=dt*9*run;if(Math.floor(old/Math.PI)!==Math.floor(p.phase/Math.PI)){SFX.step();
          for(let k=0;k<2;k++)parts.push({x:p.x-G.cam+(Math.random()-.5)*8,y:GROUND-3,vx:-dir*(20+Math.random()*24),vy:-10-Math.random()*20,grav:80,l:0,ml:.45+Math.random()*.25,r:2+Math.random()*2,col:'rgba(170,150,120,.5)',shrink:1});}}
      else p.moving=false;
      G.camTarget=clamp(p.x-300,0,G.walk.len-W);G.cam=lerp(G.cam,G.camTarget,1-Math.pow(.001,dt));
      spawnParts(G.era==='1968'?(S.routeB1==='A'?'1968':'1968'):'1944');
      if(G.era==='1944'){AU.boomTimer-=dt;if(AU.boomTimer<=0){AU.boomTimer=6+Math.random()*7;G.skyFlash=1;noise(1.4,70,.14);}}
      if(p.x>G.walk.arX-175){G.state='dialog';G.camTarget=clamp(G.walk.arX-640,0,G.walk.len-W);
        D.arKind=G.walk.ar;D.arExpr='neutral';D.elExpr='neutral';startNode(G.walk.node);}
      break;}
    case 'dialog':
      if(G.cam!==G.camTarget)G.cam=lerp(G.cam,G.camTarget,1-Math.pow(.002,dt));
      spawnParts(G.era==='1968'?'1968':G.era);
      if(G.era==='1944'){AU.boomTimer-=dt;if(AU.boomTimer<=0){AU.boomTimer=6+Math.random()*7;G.skyFlash=1;noise(1.4,70,.12);}}
      updateDialog(dt,mx,my);break;
    case 'vortex':{
      G.vortex.t+=dt/2.4;
      for(let i=0;i<2;i++)parts.push({x:W/2,y:H/2,vx:(Math.random()-.5)*520,vy:(Math.random()-.5)*400,l:0,ml:.5,r:1.4+Math.random()*1.6,col:G.vortex.rewind?'rgba(255,120,90,.8)':'rgba(150,225,255,.8)',shrink:1});
      if(G.vortex.t>=1){const to=G.vortex.to;G.vortex=null;G.whiteFlash=1;
        if(to==='1944')startWalk('1944');else if(to==='1968')startWalk('1968');else startWalk('1999');}
      break;}
    case 'glitch':
      G.glitch.t+=dt;
      if(G.glitch.t>1.7){G.glitch=null;startVortex('1944',true);}
      break;
    case 'endcard':
      G.endCard.t+=dt;
      if((G.endCard.t>2)&&(advHit()||ptr.tap)){ptr.tap=false;SFX.confirm();G.state='title';G.t=0;setAmbience('title');}
      break;
  }
  ptr.tap=false;
  for(const k in pressed)pressed[k]=false;
}
let ambSet='';
function setAmbOnce(k){if(ambSet!==k){ambSet=k;setAmbience(k);}}

/* ---------- render ---------- */
function drawScene(c,cam){if(cam===undefined)cam=G.cam;const t=T;
  if(G.era==='1944')bg1944(c,cam,t);
  else if(G.era==='1968')bg1968(c,cam,t,S.routeB1==='A');
  else if(G.era==='1999')bg1999(c,cam,t);
  else bg2088(c,cam,t);
  drawParts(c,1/60);
}
function drawChars(c,mode,cam){if(cam===undefined)cam=G.cam; // mode: 'walk' (dunia) | 'dialog' | 'prologue'
  const t=T,p=G.player;
  const elScreenX = mode==='walk' ? p.x-cam : (mode==='prologue'? W*0.42 : (G.walk? G.walk.arX-190-cam : W*0.42));
  c.save();c.translate(elScreenX,GROUND);groundShadow(c,p.moving&&mode==='walk'?.82:1);
  if(!p.facingRight&&mode==='walk')c.scale(-1,1);
  drawElena(c,t,p.phase,p.moving&&mode==='walk',D.elExpr,{vial:G.state==='endcard'||(G.state==='dialog'&&D.node==='true_end'&&D.i>4),lean:p.moving&&mode==='walk'?.05:0});
  c.restore();
  if(G.walk&&G.walk.ar&&(mode==='walk'||mode==='dialog')){
    const ax=G.walk.arX-cam;
    c.save();c.translate(ax,GROUND);groundShadow(c);c.scale(-1,1); // menghadap kiri (ke Elena)
    drawArthur(c,D.arKind,t,D.arExpr,{tremble:D.arKind==='tua'&&D.arExpr==='mad'});
    c.restore();
  }
}
function render(){
  ctx.save();
  if(G.shakeT>0){const a=G.shakeA*G.shakeT;ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a);}
  ctx.fillStyle='#0a0806';ctx.fillRect(-20,-20,W+40,H+40);
  if(G.state==='load'){
    ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);
    const pr=AS.total?AS.done/AS.total:1;
    ctx.textAlign='center';ctx.fillStyle='#F5F0E8';ctx.font='bold 26px Georgia,serif';
    ctx.fillText('HEARTS ACROSS TIME',W/2,H/2-64);
    ctx.fillStyle='#C25A5A';ctx.font='italic 15px Georgia,serif';ctx.fillText('— Break The Loop —',W/2,H/2-38);
    ctx.font='12px "Trebuchet MS",sans-serif';ctx.fillStyle='rgba(245,240,232,.6)';
    ctx.fillText(AS.ready?'':'MEMUAT ASET…',W/2,H/2+14);
    ctx.fillStyle='#241d18';rr(ctx,W/2-160,H/2+38,320,14,7);ctx.fill();
    if(pr>0){ctx.fillStyle='#C25A5A';rr(ctx,W/2-160,H/2+38,Math.max(14,320*pr),14,7);ctx.fill();}
  }
  else if(G.state==='title'){
    bg2088(ctx,0,T,0);drawParts(ctx,1/60);spawnParts('2088');
    ctx.save();ctx.translate(W*0.5,GROUND+2);groundShadow(ctx);drawElena(ctx,T,0,false,'sad');ctx.restore();
    grade(ctx,'2088');
    // judul
    ctx.textAlign='center';
    ctx.save();ctx.translate(W/2,168);
    const pul=.5+.5*Math.sin(T*1.4);
    ctx.shadowColor=`rgba(194,59,59,${.5+pul*.4})`;ctx.shadowBlur=26;
    ctx.fillStyle='#F5F0E8';ctx.font='bold 58px Georgia,serif';ctx.fillText('HEARTS ACROSS TIME',0,0);
    ctx.shadowBlur=0;ctx.fillStyle='#C23B3B';ctx.font='italic 21px Georgia,serif';ctx.fillText('— Break The Loop —',0,44);
    ctx.restore();
    ctx.fillStyle='rgba(245,240,232,.85)';ctx.font='17px "Trebuchet MS",sans-serif';
    ctx.fillText((Math.floor(T*2)%2===0)?'▶ TEKAN ENTER / SENTUH UNTUK MULAI':'  TEKAN ENTER / SENTUH UNTUK MULAI  ',W/2,340);
    ctx.fillStyle='rgba(245,240,232,.5)';ctx.font='12.5px "Trebuchet MS",sans-serif';
    ctx.fillText('Gerak: ← → / A D   •   Dialog: ENTER / Klik   •   Bisu: M',W/2,470);
    ctx.fillText('2D Narrative Puzzle • Psychological Time-Loop • COMPFEST Indie Game Jam',W/2,492);
    ctx.fillStyle='rgba(245,240,232,.35)';ctx.font='11px "Trebuchet MS",sans-serif';
    ctx.fillText('Berdasarkan Game Design Document "FIKS IDE" — Hearts Across Time',W/2,512);
  }
  else if(G.state==='prologue'){
    bg2088(ctx,0,T,.25);drawParts(ctx,1/60);spawnParts('2088');
    ctx.save();ctx.translate(W*0.42,GROUND);groundShadow(ctx);drawElena(ctx,T,0,false,'sad');ctx.restore();
    grade(ctx,'2088');
    // denyut vignette merah menyala sinkron dengan SFX detak jantung
    {const hb=T%2.4;if(hb<.6){const a=Math.sin(hb/.6*Math.PI)*.22;const vg=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,`rgba(140,20,20,${a})`);ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);}}
    if(D.line)drawNarr(ctx,D.line.text,D.prog);
    if(!D.choices&&D.line&&D.prog>=1)hintAdvance(ctx);
  }
  else if(G.state==='walk'||G.state==='dialog'){
    const camDrift=G.cam+Math.sin(T*.4)*.9; // nafas kamera halus
    drawScene(ctx,camDrift);drawChars(ctx,G.state,camDrift);
    grade(ctx,G.era==='1968'?(S.routeB1==='A'?'1968A':'1968B'):G.era);
    if(G.skyFlash>0){const a=G.skyFlash;const g=ctx.createLinearGradient(0,0,0,H*.8);g.addColorStop(0,`rgba(255,190,120,${.34*a})`);g.addColorStop(.55,`rgba(255,150,80,${.16*a})`);g.addColorStop(1,'rgba(255,150,80,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.8);ctx.fillStyle=`rgba(255,214,150,${.08*a})`;ctx.fillRect(0,0,W,H);}
    // caption babak
    if(G.captionT>0&&G.state==='walk'){
      const a=Math.min(1,G.captionT)*Math.min(1,(3.2-G.captionT)*2);
      ctx.fillStyle=`rgba(10,8,6,${.45*a})`;ctx.fillRect(0,64,W,44);
      ctx.fillStyle=`rgba(245,240,232,${a})`;ctx.textAlign='center';ctx.font='bold 19px Georgia,serif';
      ctx.fillText(G.caption,W/2,92);
    }
    if(G.state==='dialog'){
      // bubble aktif
      if(D.line){
        if(D.line.who==='narrator')drawNarr(ctx,D.line.text,D.prog);
        else{
          const isE=D.line.who==='elena';
          const x=isE?(G.walk.arX-190-G.cam):(G.walk.arX-G.cam);
          const headY=GROUND-124;
          drawBubble(ctx,x,headY,D.line.text,D.line.who,D.prog);
        }
        if(!D.choices&&D.prog>=1&&G.state==='dialog')hintAdvance(ctx);
      }
      if(D.choices)drawChoices(ctx,D.choices,D.sel,ptr.x,ptr.y,D.choiceT);
    }
    // HUD loop
    if(S.loop>0){ctx.save();ctx.font='bold 13px monospace';const j=S.loop>0&&G.state==='walk'&&G.captionT>0?2:0;
      ctx.fillStyle=`rgba(194,59,59,.9)`;ctx.textAlign='left';
      ctx.fillText('⟲ LOOP '+S.loop,18+j*(Math.random()-.5),26+j*(Math.random()-.5));ctx.restore();}
    // kontrol sentuh
    if(IS_TOUCH&&G.state==='walk'){ctx.fillStyle='rgba(245,240,232,.25)';
      [[36,'◀'],[W-36,'▶']].forEach(([x,s])=>{ctx.beginPath();ctx.arc(x,H-70,30,0,TAU);ctx.fill();ctx.fillStyle='rgba(30,23,16,.8)';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(s,x,H-62);ctx.fillStyle='rgba(245,240,232,.25)';});}
  }
  else if(G.state==='vortex'){
    const v=G.vortex,pr=easeIO(clamp(v.t,0,1));
    ctx.fillStyle='#050508';ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(W/2,H/2);
    const rot=(v.rewind?-1:1)*pr*TAU*2.2;
    ctx.rotate(rot*.25);
    for(let i=0;i<46;i++){
      const ang=i/46*TAU+rot*(i%3===0?1.6:.7);
      const rad=30+((i*97)%420)*(0.3+pr*1.4)*(.4+((i*31)%100)/80);
      const x=Math.cos(ang)*rad,y=Math.sin(ang)*rad*.55;
      const hue=v.rewind?`rgba(226,80,60,`:`rgba(80,200,255,`;
      ctx.fillStyle=hue+(.25+.55*Math.abs(Math.sin(i+T*3)))+')';
      ctx.fillRect(x,y,2+((i%4)),2+((i%3)));
    }
    ctx.rotate(-rot*.25);
    for(let r=40;r<430;r+=34){ctx.strokeStyle=v.rewind?`rgba(226,80,60,${.34-(r/430)*.28})`:`rgba(90,205,255,${.34-(r/430)*.28})`;ctx.lineWidth=2.2;
      ctx.beginPath();ctx.ellipse(0,0,r,r*.5,rot*.13,0,TAU);ctx.stroke();}
    const gl=.6+.4*Math.sin(T*10);
    const g=ctx.createRadialGradient(0,0,0,0,0,120);g.addColorStop(0,v.rewind?`rgba(255,120,90,${.5*gl})`:`rgba(140,225,255,${.5*gl})`);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,120,0,TAU);ctx.fill();
    ctx.restore();
    drawParts(ctx,1/60); // jejak energi terbang di pusaran
    // angka tahun menghitung (RGB split saat distorsi)
    const y=Math.round(lerp(v.from,ERA_CONF[v.to].from,pr));
    ctx.textAlign='center';ctx.font='bold 64px monospace';
    const yr=String(y),roff=3+pr*5;
    ctx.globalCompositeOperation='screen';
    ctx.fillStyle='rgba(255,60,60,.8)';ctx.fillText(yr,W/2-roff,H/2+16);
    ctx.fillStyle='rgba(60,200,255,.8)';ctx.fillText(yr,W/2+roff,H/2+16);
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=v.rewind?`rgba(255,110,80,.95)`:'rgba(180,235,255,.95)';
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=24;ctx.fillText(yr,W/2,H/2+16);ctx.shadowBlur=0;
    ctx.font='14px "Trebuchet MS",sans-serif';ctx.fillStyle='rgba(245,240,232,.6)';
    ctx.fillText(v.rewind?'SINYAL REALITAS TERPUTUS — MENGULANG SIKLUS':'LOKASI TEMPAT UNTUK MELIHAT WAKTU',W/2,H-64);
    if(pr>.82){ctx.fillStyle=`rgba(255,255,255,${(pr-.82)/.18})`;ctx.fillRect(0,0,W,H);}
  }
  else if(G.state==='glitch'){
    drawScene(ctx);drawChars(ctx,'dialog');grade(ctx,G.era);
    // efek glitch strip
    const gt=G.glitch.t;
    for(let i=0;i<14;i++){
      const sy=Math.random()*H,sh=6+Math.random()*36,off=(Math.random()-.5)*90*(1-gt/2);
      try{ctx.drawImage(cv,0,sy,W,sh,off,sy,W,sh);}catch(e){}
    }
    // ghosting RGB layar penuh
    ctx.globalCompositeOperation='screen';ctx.globalAlpha=.2;
    try{const o2=3*(1-Math.min(gt,1.4)/1.4);ctx.drawImage(cv,o2,0);ctx.drawImage(cv,-o2,0);}catch(e){}
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    if(Math.random()<.5){ctx.globalCompositeOperation='difference';ctx.fillStyle=`rgba(${Math.random()*255|0},40,60,.5)`;ctx.fillRect(0,Math.random()*H,W,20+Math.random()*80);ctx.globalCompositeOperation='source-over';}
    for(let i=0;i<26;i++){ctx.fillStyle=`rgba(245,240,232,${Math.random()*.5})`;ctx.fillRect(Math.random()*W,Math.random()*H,30+Math.random()*80,1.6);}
    if(gt>.3&&gt<1.2&&Math.floor(gt*14)%2===0){
      ctx.textAlign='center';ctx.font='bold 84px monospace';ctx.fillStyle='#E2503C';
      ctx.shadowColor='#E2503C';ctx.shadowBlur=30;ctx.fillText('⟲ LOOP '+S.loop,W/2,H/2);ctx.shadowBlur=0;
      ctx.font='bold 20px monospace';ctx.fillStyle='#F5F0E8';ctx.fillText('REALITAS TERPECAH — TIMELINE DI-RESET',W/2,H/2+44);
    }
  }
  else if(G.state==='endcard'){
    bg1999(ctx,120,T);drawParts(ctx,1/60);spawnParts('1999');
    ctx.save();ctx.translate(W*0.5-60,GROUND);groundShadow(ctx);drawElena(ctx,T,0,false,'warm',{vial:true});ctx.restore();
    grade(ctx,'1999');
    const a=clamp(G.endCard.t/2,0,1);
    ctx.fillStyle=`rgba(10,8,6,${.55*a})`;ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle=`rgba(245,240,232,${a})`;ctx.font='italic 26px Georgia,serif';ctx.fillText('THE END',W/2,168);
    ctx.fillStyle=`rgba(194,59,59,${a})`;ctx.font='bold 30px Georgia,serif';ctx.fillText('HEARTS ACROSS TIME: BREAK THE LOOP',W/2,208);
    // statistik hidden affinity terungkap
    if(G.endCard.t>1.6){
      const a2=clamp((G.endCard.t-1.6)/1.4,0,1);
      ctx.fillStyle=`rgba(245,240,232,${.85*a2})`;ctx.font='15px "Trebuchet MS",sans-serif';
      ctx.fillText(`Siklus ditempuh : ${S.loop}× loop`,W/2,286);
      ctx.fillStyle=`rgba(184,92,110,${.9*a2})`;ctx.fillText(`♥ Empati : ${S.empathy}`,W/2-120,316);
      ctx.fillStyle=`rgba(91,122,153,${.9*a2})`;ctx.fillText(`⚙ Logika : ${S.logic}`,W/2+120,316);
      ctx.fillStyle=`rgba(245,240,232,${.55*a2})`;ctx.font='italic 14px Georgia,serif';
      ctx.fillText('"...di tahun 2088, kita akan bertemu lagi sebagai dua orang biasa yang saling jatuh cinta."',W/2,364);
    }
    if(G.endCard.t>2.6&&Math.floor(T*2)%2===0){ctx.fillStyle='rgba(245,240,232,.75)';ctx.font='14px "Trebuchet MS",sans-serif';ctx.fillText('▶ MAIN LAGI (ENTER / SENTUH)',W/2,452);}
  }
  // white flash di atas segalanya
  if(G.whiteFlash>0){ctx.fillStyle=`rgba(255,255,255,${clamp(G.whiteFlash,0,1)})`;ctx.fillRect(0,0,W,H);}
  ctx.restore();
  drawMuteBtn(ctx);
}
function hintAdvance(c){c.fillStyle=`rgba(245,240,232,${.4+.3*Math.sin(T*5)})`;c.font='12px "Trebuchet MS",sans-serif';c.textAlign='center';c.fillText('▼ ENTER / KLIK',W/2,H-10);}
function drawMuteBtn(c){
  const x=W-34,y=26;c.save();c.globalAlpha=.65;c.fillStyle='#0a0806';c.beginPath();c.arc(x,y,15,0,TAU);c.fill();
  c.strokeStyle='#F5F0E8';c.lineWidth=1.6;c.beginPath();c.arc(x,y,15,0,TAU);c.stroke();
  c.fillStyle='#F5F0E8';c.font='13px sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText(AU.muted?'🔇':'🔊',x,y+1);c.restore();c.textBaseline='alphabetic';
  if(ptr.tap&&Math.hypot(ptr.x-x,ptr.y-y)<20){toggleMute();ptr.tap=false;}
}
function toggleMute(){AU.muted=!AU.muted;if(AU.master)AU.master.gain.value=AU.muted?0:.9;
  if(!AU.muted){setAmbience(G.state==='title'?'title':(ERA_CONF[G.era]?ERA_CONF[G.era].amb:'2088'));}}

/* ---------- loop utama ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  try{
  if(keyOnce('m')||keyOnce('M'))toggleMute();
  update(dt);render();
  }catch(e){if(!frame.errOnce){frame.errOnce=true;console.error(e);}}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
