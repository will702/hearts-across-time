name: QA

on:
  push:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hearts-qa
          path: qa/artifacts
          retention-days: 7
