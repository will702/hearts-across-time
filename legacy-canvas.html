<script>
"use strict";
/* ============================================================
   HEARTS ACROSS TIME — Break The Loop
   2D Side-Scroller Narrative Puzzle / Psychological Time-Loop
   COMPFEST Indie Game Jam — berdasarkan GDD "FIKS IDE.md"
   Semua aset digambar prosedural (palet dari referensi).
   ============================================================ */

/* ---------- Konstanta & util ---------- */
const W=960, H=540, GROUND=444;
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeO=t=>1-Math.pow(1-t,3);
const easeOB=t=>1+2.70158*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2); // overshoot spring
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function fmt(n){return Math.round(n)}

/* ---------- Skala layar ---------- */
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;

/* ---------- Audio prosedural (WebAudio) ---------- */
const AU={ctx:null,master:null,muted:false,amb:[],boomTimer:0,heartTimer:0};
function ac(){if(!AU.ctx){AU.ctx=new (window.AudioContext||window.webkitAudioContext)();AU.master=AU.ctx.createGain();AU.master.gain.value=vGain(OPTS.vol);
    // graf bus: master -> limiter(kompressor) -> out ; sub-bus: SFX / Ambience / Musik
    const comp=AU.ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=18;comp.ratio.value=6;comp.attack.value=.004;comp.release.value=.24;comp.connect(AU.ctx.destination);AU.master.connect(comp);
    AU.sfxBus=AU.ctx.createGain();AU.sfxBus.connect(AU.master);
    AU.ambBus=AU.ctx.createGain();AU.ambBus.gain.value=.9*vGain(OPTS.volSfx);AU.ambBus.connect(AU.master);
    AU.musBus=AU.ctx.createGain();AU.musBus.gain.value=.8;AU.musBus.connect(AU.master);
    // reverb (impulse noise buatan) + feedback-delay hanya untuk musik
    AU.verb=AU.ctx.createConvolver();AU.verb.buffer=impulse(AU.ctx,2.6,2.4);const vout=AU.ctx.createGain();vout.gain.value=.5;AU.verb.connect(vout);vout.connect(AU.musBus);
    AU.dly=AU.ctx.createDelay(1);AU.dly.delayTime.value=.34;const dfb=AU.ctx.createGain();dfb.gain.value=.36;const dlp=AU.ctx.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=2400;AU.dly.connect(dlp);dlp.connect(dfb);dfb.connect(AU.dly);const dout=AU.ctx.createGain();dout.gain.value=.5;dlp.connect(dout);dout.connect(AU.musBus);
    AU.mIn=AU.ctx.createGain();AU.mIn.connect(AU.musBus);const sd=AU.ctx.createGain();sd.gain.value=.18;AU.mIn.connect(sd);sd.connect(AU.dly);const sv=AU.ctx.createGain();sv.gain.value=.32;AU.mIn.connect(sv);sv.connect(AU.verb);
  }if(AU.ctx.state==='suspended')AU.ctx.resume();return AU.ctx;}
function impulse(c,dur,decay){const n=c.sampleRate*dur,b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}return b;}
function beep(f,d,type='sine',g=.15,slide=0,when=0){if(AU.muted)return;const c=ac(),t=c.currentTime+when,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(AU.sfxBus||AU.master);o.start(t);o.stop(t+d+.02);}
function noiseBuf(c,d){const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;return b;}
function noise(d,fq,g=.1,type='lowpass',when=0){if(AU.muted)return;const c=ac(),t=c.currentTime+when,s=c.createBufferSource();s.buffer=noiseBuf(c,d);const f=c.createBiquadFilter();f.type=type;f.frequency.value=fq;const v=c.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(v);v.connect(AU.sfxBus||AU.master);s.start(t);s.stop(t+d);}
const SFX={
  select:()=>beep(620,.05,'square',.08),
  confirm:()=>{beep(760,.07,'square',.1);beep(1140,.09,'square',.09,0,.06);},
  step:()=>{ // langkah CC0 per-permukaan (filter per era) — fallback noise prosedural
    const fe=G.era==='1968'?(S.routeB1==='A'?'1968A':'1968B'):G.era; // permukaan mengikuti rute bunker/lab
    const f={'1944':['lowpass',460],'2088':['lowpass',950],'1968A':['bandpass',820],'1968B':['bandpass',1500],'1999':['highpass',1500]}[fe]||['highpass',900];
    if(!playSfxBuf(['step0','step1','step2','step3'],.4,1,f))noise(.05,420,.05+Math.random()*.02);},
  flip:()=>{if(T-((SFX._flipT===undefined)?-9:SFX._flipT)<.22)return;SFX._flipT=T; // throttle: jangan spam saat fast-forward
    if(!playSfxBuf(['flip','flip2'],.5,1))noise(.04,2400,.03,'highpass');}, // rustle kertas panel dialog
  heart:()=>{beep(52,.14,'sine',.5);beep(46,.16,'sine',.42,0,.22);},
  glitch:()=>{for(let i=0;i<5;i++){beep(200+Math.random()*1400,.04,'square',.07,600,i*.09);noise(.06,3000+Math.random()*3000,.08,'bandpass',i*.09);}},
  boom:()=>{noise(1.1,90,.5);beep(38,.9,'sine',.5,-14);noise(.25,500,.15,'lowpass',.02);},
  vortexF:()=>{if(AU.muted)return;beep(140,1.6,'sawtooth',.09,860);noise(1.6,900,.07,'bandpass');beep(880,.5,'sine',.08,500,1.2);},
  vortexR:()=>{if(AU.muted)return;beep(980,1.5,'sawtooth',.09,-820);noise(1.5,700,.08,'bandpass');beep(120,.5,'square',.09,-60,1.1);},
  chime:()=>{[440,554.4,659.3,880].forEach((f,i)=>beep(f,.9,'sine',.12,0,i*.16));},
  flash:()=>noise(.3,2500,.12,'highpass'),
};
function stopAmb(){AU.amb.forEach(n=>{try{n.g.gain.linearRampToValueAtTime(.0001,ac().currentTime+.6);n.s.forEach(s=>{try{s.stop(ac().currentTime+.7)}catch(e){}});}catch(e){}});AU.amb=[];}
function ambNode(make){if(AU.muted)return;const c=ac(),g=c.createGain();g.gain.value=0;g.connect(AU.ambBus||AU.master);const srcs=make(c,g);g.gain.linearRampToValueAtTime(1,c.currentTime+1.2);const nodes={g,s:srcs};AU.amb.push(nodes);srcs.forEach(s=>{try{s.start()}catch(e){}});}
function setAmbience(kind){stopAmb();ambSet=kind;setSong(kind?AMB_SONG[kind]||'':'');duckMusic(kind?1:0,kind?.8:.5);if(AU.muted||!AU.ctx||!kind)return;
  if(kind==='2088'||kind==='title'){ambNode((c,g)=>{const s=c.createBufferSource();s.buffer=noiseBuf(c,3);s.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=320;const l=c.createOscillator();l.frequency.value=.13;const lg=c.createGain();lg.gain.value=140;l.connect(lg);lg.connect(f.frequency);l.start();const v=c.createGain();v.gain.value=.05;s.connect(f);f.connect(v);v.connect(g);return[s,l];});}
  if(kind==='1944'){ambNode((c,g)=>{const s=c.createBufferSource();s.buffer=noiseBuf(c,3);s.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=130;const v=c.createGain();v.gain.value=.09;s.connect(f);f.connect(v);v.connect(g);return[s];});}
  if(kind==='1968'){ambNode((c,g)=>{const o=c.createOscillator();o.type='sine';o.frequency.value=55;const v=c.createGain();v.gain.value=.035;o.connect(v);v.connect(g);const s=c.createBufferSource();s.buffer=noiseBuf(c,2);s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=780;const v2=c.createGain();v2.gain.value=.016;s.connect(f);f.connect(v2);v2.connect(g);return[o,s];});}
  if(kind==='1999'){ambNode((c,g)=>{const os=[220,329.6,440].map(fr=>{const o=c.createOscillator();o.type='triangle';o.frequency.value=fr*(1+(Math.random()-.5)*.004);const v=c.createGain();v.gain.value=.028;o.connect(v);v.connect(g);return o;});const l=c.createOscillator();l.frequency.value=.3;const lg=c.createGain();lg.gain.value=.012;l.connect(lg);lg.connect(g.gain);l.start();return[...os,l];});}
  (AMB_LAYER[kind]||[]).forEach(([id,v])=>ambBufLoop(id,v)); // loop rekaman CC0 berlapis
}

/* ============================================================
   MUSIK PROSEDURAL — sequencer leitmotif "Hearts Across Time"
   Track: pad / bass / musicbox / bell / tick, dijadwalkan lookahead.
   Lembar soal sama, aransemen beda per era (teknik leitmotif):
   title=kotak musik Am • 1944=drone tritone • 1968=pulse mata-mata
   1999=bel arpeggio Am9 • true end=motif yang sama → resolusi C mayor
   ============================================================ */
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function NF(s){const m=s.match(/^([A-G][#b]?)(\d)$/);return 440*Math.pow(2,(NOTE[m[1]]+12*(+m[2]+1)-69)/12);}
function arpEv(start,notes,gap,dur,vel=.8){const seq=notes.concat(notes.slice(1,-1).reverse());return seq.map((n,i)=>[start+i*gap,n,dur,vel]);}
const MELODI=[ // leitmotif (16 langkah/bar, 8 bar)
  [0,'A4',6],[6,'C5',3],[10,'E5',6],[16,'D5',6],[22,'C5',3],[26,'B4',6],
  [32,'A4',4],[36,'B4',3],[40,'C5',3],[44,'D5',6],[48,'E5',12],
  [64,'F5',6],[70,'E5',3],[74,'D5',3],[78,'C5',6],[80,'D5',6],[86,'E5',3],[90,'C5',3],[94,'A4',6],
  [96,'B4',6],[102,'G4',3],[106,'E4',6],[112,'A4',16],[112,'A5',14,.7]];
const SONGS={
  theme:{bpm:74,len:128,tracks:[ // judul & 2088 — kotak musik melankolis
    {v:'pad',ev:[[0,['A3','C4','E4'],16],[16,['G3','B3','D4'],16],[32,['A3','C4','E4'],16],[48,['E3','G#3','B3'],16],[64,['F3','A3','C4'],16],[80,['C3','E3','G3'],16],[96,['E3','G#3','B3'],16],[112,['A3','C4','E4'],16]]},
    {v:'bass',ev:[[0,'A2',16],[16,'G2',16],[32,'A2',16],[48,'E2',16],[64,'F2',16],[80,'C3',16],[96,'E2',16],[112,'A2',16]]},
    {v:'musicbox',ev:MELODI}]},
  war:{bpm:62,len:128,tracks:[ // 1944 — drone rendah + tritone Eb (ketegangan)
    {v:'pad',ev:[[0,['A2','E3'],28],[32,['A2','E3'],28],[64,['F2','C3'],28],[96,['D#2','A#2'],30]]},
    {v:'bass',ev:[[0,'A1',24],[32,'A1',24],[64,'F1',24],[96,'D#2',26]]},
    {v:'bell',ev:[[16,'D5',8,.55],[48,'A4',8,.55],[80,'D#5',8,.6],[112,'E5',10,.65]]}]},
  spy:{bpm:92,len:128,tracks:[ // 1968 — pulse bass mata-mata + frasa motif
    {v:'bass',ev:(()=>{const roots=['A2','A2','F2','G2','A2','A2','F2','E2'],e=[];roots.forEach((r,i)=>{const b=i*16,r3=r.replace('2','3');e.push([b,r,2],[b+4,r,2],[b+8,r3,2],[b+12,r,2]);});return e;})()},
    {v:'pad',ev:[[0,['A3','C4','E4'],30],[32,['F3','A3','C4'],14],[48,['G3','B3','D4'],14],[64,['A3','C4','E4'],30],[96,['F3','A3','C4'],14],[112,['E3','G#3','B3'],14]]},
    {v:'tick',ev:(()=>{const e=[];for(let i=0;i<64;i++)e.push([i*2,'x',1,i%8===4?.8:.45]);return e;})()},
    {v:'musicbox',ev:[[32,'C5',4,.7],[38,'B4',4,.7],[96,'B4',6,.7],[104,'G#4',6,.7]]}]},
  cryo:{bpm:66,len:128,tracks:[ // 1999 — bel Am9 arpeggio berkilau
    {v:'bell',ev:[...arpEv(0,['A4','C5','E5','G5','B5'],2,4),...arpEv(16,['A4','C5','E5','G5','B5'],2,4),...arpEv(32,['F4','A4','C5','E5','G5'],2,4),...arpEv(48,['C4','E4','G4','B4','D5'],2,4),...arpEv(64,['A4','C5','E5','G5','B5'],2,4),...arpEv(80,['A4','C5','E5','G5','B5'],2,4),...arpEv(96,['F4','A4','C5','E5','G5'],2,4),...arpEv(112,['E4','G#4','B4','E5','G#5'],2,4)]},
    {v:'pad',ev:[[0,['A2','E3','B3'],30],[32,['F2','C3','A3'],30],[64,['A2','E3','B3'],30],[96,['E2','B2','G#3'],30]]},
    {v:'bass',ev:[[0,'A1',30],[32,'F2',30],[64,'A1',30],[96,'E2',30]]}]},
  end:{bpm:76,len:128,dbl:true,tracks:[ // true ending — motif yang sama, C mayor, hangat
    {v:'pad',ev:[[0,['A3','C4','E4'],16],[16,['F3','A3','C4'],16],[32,['C3','E3','G3'],16],[48,['G2','B2','D3'],16],[64,['F3','A3','C4'],16],[80,['C3','E3','G3'],16],[96,['G2','B2','D3'],16],[112,['C3','E3','G3'],16]]},
    {v:'bass',ev:[[0,'A2',16],[16,'F2',16],[32,'C3',16],[48,'G2',16],[64,'F2',16],[80,'C3',16],[96,'G2',16],[112,'C3',16]]},
    {v:'musicbox',ev:MELODI}]},
};
const AMB_SONG={'title':'theme','2088':'theme','1944':'war','1968':'spy','1999':'cryo'};
const MUS={name:'',song:null,map:null,step:0,nextT:0};
function buildMap(s){const m={};s.tracks.forEach(tr=>tr.ev.forEach(e=>{(m[e[0]]=m[e[0]]||[]).push({v:tr.v,notes:Array.isArray(e[1])?e[1]:[e[1]],dur:e[2]||6,vel:e[3]||1});}));return m;}
function setSong(nm){if(MUS.name===nm)return;MUS.name=nm;MUS.song=SONGS[nm]||null;MUS.map=MUS.song?buildMap(MUS.song):null;MUS.step=0;if(AU.ctx)MUS.nextT=AU.ctx.currentTime+.06;}
function duckMusic(level,rel){if(!AU.ctx||!AU.musBus)return;const t=AU.ctx.currentTime;try{AU.musBus.gain.cancelScheduledValues(t);AU.musBus.gain.setValueAtTime(AU.musBus.gain.value,t);AU.musBus.gain.linearRampToValueAtTime(.8*vGain(OPTS.volMus)*level,t+(rel||.4));}catch(e){}}
function vMusicbox(f,t,g){const c=AU.ctx;[[1,1],[3.98,.16],[6.1,.05]].forEach(([r,a])=>{const o=c.createOscillator();o.type='sine';o.frequency.value=f*r;const og=c.createGain();og.gain.setValueAtTime(g*a,t);og.gain.exponentialRampToValueAtTime(.0001,t+1.4/Math.sqrt(r));o.connect(og);og.connect(AU.mIn);o.start(t);o.stop(t+1.5);});}
function vBell(f,t,g){const c=AU.ctx;const car=c.createOscillator();car.type='sine';car.frequency.value=f;const mod=c.createOscillator();mod.type='sine';mod.frequency.value=f*2.4;const mg=c.createGain();mg.gain.setValueAtTime(f*1.6,t);mg.gain.exponentialRampToValueAtTime(f*.02,t+1.1);mod.connect(mg);mg.connect(car.frequency);const bg=c.createGain();bg.gain.setValueAtTime(g,t);bg.gain.exponentialRampToValueAtTime(.0001,t+2.2);car.connect(bg);bg.connect(AU.mIn);car.start(t);mod.start(t);car.stop(t+2.3);mod.stop(t+2.3);}
function vPad(f,t,dur,g){const c=AU.ctx;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=850;const vg=c.createGain();vg.gain.setValueAtTime(.0001,t);vg.gain.linearRampToValueAtTime(g,t+.5);vg.gain.setValueAtTime(g,t+dur*.6);vg.gain.linearRampToValueAtTime(.0001,t+dur);lp.connect(vg);vg.connect(AU.mIn);[-4,4].forEach(d2=>{const o=c.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=d2;o.connect(lp);o.start(t);o.stop(t+dur+.1);});}
function vBass(f,t,dur,g){const c=AU.ctx;const o=c.createOscillator();o.type='triangle';o.frequency.value=f;const o2=c.createOscillator();o2.type='sine';o2.frequency.value=f*2;const g2=c.createGain();g2.gain.value=.35;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;const bg=c.createGain();bg.gain.setValueAtTime(.0001,t);bg.gain.linearRampToValueAtTime(g,t+.02);bg.gain.setValueAtTime(g*.7,t+dur*.7);bg.gain.linearRampToValueAtTime(.0001,t+dur);o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(bg);bg.connect(AU.mIn);o.start(t);o.stop(t+dur+.05);o2.start(t);o2.stop(t+dur+.05);}
function vTick(t,g){const c=AU.ctx;const s=c.createBufferSource();s.buffer=noiseBuf(c,.02);const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const tg=c.createGain();tg.gain.setValueAtTime(g,t);tg.gain.exponentialRampToValueAtTime(.0001,t+.03);s.connect(f);f.connect(tg);tg.connect(AU.mIn);s.start(t);}
function musTick(){const c=AU.ctx;if(!c||!MUS.song||AU.muted)return;if(!MUS.nextT||MUS.nextT<c.currentTime-.5)MUS.nextT=c.currentTime+.05;const s=MUS.song,spb=60/s.bpm/4;
  while(MUS.nextT<c.currentTime+.16){const evs=MUS.map[MUS.step];
    if(evs)evs.forEach(e=>{const t=MUS.nextT,spbDur=e.dur*spb,g=.26*e.vel;e.notes.forEach(n=>{
      if(e.v==='tick'){vTick(t,g*.5);return;}
      const f=NF(n);
      if(e.v==='pad')vPad(f,t,spbDur+.15,g*.5);
      else if(e.v==='bass')vBass(f,t,spbDur,g);
      else if(e.v==='bell')vBell(f,t,g);
      else if(e.v==='tick')vTick(t,g*.5);
      else{vMusicbox(f,t,g);if(s.dbl)vBell(f*2,t,g*.35);}});});
    MUS.step=(MUS.step+1)%s.len;MUS.nextT+=spb;}}
setInterval(musTick,42);

/* ---------- Input ---------- */
const keys={},pressed={};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter','Tab'].includes(e.key))e.preventDefault();if(!keys[e.key])pressed[e.key]=true;keys[e.key]=true;initAudioOnce();});
addEventListener('keyup',e=>{keys[e.key]=false;});
let ptr={x:0,y:0,down:false,tap:false};
function cvXY(e){const r=cv.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left,cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return{x:cx/r.width*W,y:cy/r.height*H};}
function pdown(e){e.preventDefault();const p=cvXY(e);ptr.x=p.x;ptr.y=p.y;ptr.down=true;ptr.tap=true;initAudioOnce();}
function pmove(e){if(e.touches)e.preventDefault();const p=cvXY(e);ptr.x=p.x;ptr.y=p.y;}
function pup(){ptr.down=false;}
cv.addEventListener('mousedown',pdown);cv.addEventListener('mousemove',pmove);addEventListener('mouseup',pup);
cv.addEventListener('touchstart',pdown,{passive:false});cv.addEventListener('touchmove',pmove,{passive:false});addEventListener('touchend',pup);
let audioInited=false;
function initAudioOnce(){if(audioInited)return;audioInited=true;ac();loadAudioBufs();}
function keyOnce(k){if(pressed[k]){pressed[k]=false;return true;}return false;}
const advHit=()=>keyOnce(' ')||keyOnce('Enter')||keyOnce('Spacebar');

/* ---------- State global ---------- */
const S={empathy:0,logic:0,routeB1:'',routeB2:'',loop:0};
const G={state:'load',t:0,player:{x:90,phase:0,moving:false,face:1,facingRight:true,vx:0,stride:0,turnT:0,acc:0},

  if(moving&&cols>1){const seq=cols>3?[1,2,3,2]:null,sub=phase/(Math.PI/2),i0=Math.floor(sub),a=sub-i0;
    const pick=k=>seq?seq[k%4]:k%cols;col=pick(i0);

function drawFace(c,expr,blink,t,col=PAL.eye,blush=false,browCol=PAL.line){
  const eyeH=(expr==='shock'||expr==='mad')?5.2:expr==='closed'?0.6:3.4;

      c.fillStyle='#FFF';c.beginPath();c.arc(dx+1.1,-eyeH*.4+2,1.3,0,TAU);c.fill();}
    outline(c,1.6);rr(c,dx-4.4,-4.6,8.8,9.2,4.2);c.stroke();

  const brow=(dx,a)=>{c.save();c.translate(dx,-8.4);c.rotate(a);c.strokeStyle=browCol;c.beginPath();c.moveTo(-3.4,0);c.quadraticCurveTo(0,-1.6,3.4,0);c.stroke();c.restore();};

  c.strokeStyle=PAL.line;c.lineWidth=1.8;c.beginPath();

  else if(expr==='sad'){c.moveTo(-3,my+1.6);c.quadraticCurveTo(0,my-1.6,3,my+1.6);}

/* --- ELENA (adaptasi GIF referensi: ash-blonde belah tengah, gaun dusty-rose, boot pucat strap gelap, proporsi 1:3) --- */
function drawElena(c,t,phase,moving,expr='neutral',opt={}){
  if(drawCharSheet(c,'elena',expr,phase,moving,opt)){if(opt.vial)drawVialOverlay(c,ASSET_MANIFEST.elena);return;}
  const st=opt.stride===undefined?1:opt.stride;
  const bob=moving?Math.abs(Math.sin(phase))*(1.6+1.4*st):Math.sin(t*2)*0.9;
  const sw=moving?Math.sin(phase)*(0.75+0.4*st):Math.sin(t*1.4)*.1;
  const sway=moving?Math.sin(phase-.9)*.05:Math.sin(t*1.3)*.018; // rambut: follow-through, tertinggal dari langkah
  c.save();c.translate(0,-bob);
  if(moving&&opt.lean)c.rotate(opt.lean);
  // rambut belakang: sepanjang tulang belikat, ujung ikal ke DALAM (referensi GIF)
  c.save();c.rotate(sway*.7);c.translate(0,-59);
  c.fillStyle=PAL.hairEs;c.beginPath();
  c.moveTo(-16,-14);
  c.quadraticCurveTo(-19,4,-18,20);
  c.quadraticCurveTo(-16,26,-11,22);c.quadraticCurveTo(-9,28,-4,23);c.quadraticCurveTo(-1,29,4,23);c.quadraticCurveTo(8,27,11,21);c.quadraticCurveTo(15,25,18,19);
  c.quadraticCurveTo(19,4,16,-14);
  c.quadraticCurveTo(14,-22,0,-22);c.quadraticCurveTo(-14,-22,-16,-14);c.closePath();c.fill();
  outline(c,2.2);c.stroke();
  c.strokeStyle=PAL.hairE;c.lineWidth=1.6;
  c.beginPath();c.moveTo(-13,2);c.quadraticCurveTo(-14,12,-12,20);c.moveTo(13,2);c.quadraticCurveTo(14,12,12,20);c.stroke();
  c.restore();
  // kaki: langkah elips ayun/tumpu — kaki ayun terangkat di tengah silang, kaki tumpu menapak penuh
  const stA=9*(0.75+0.4*st),stL=3.2*(0.5+0.7*st);
  const lx1=moving?stA*Math.sin(phase):sw*9,lx2=moving?stA*Math.sin(phase+Math.PI):-sw*9;
  const ly1=moving?stL*Math.max(0,Math.cos(phase)):0,ly2=moving?stL*Math.max(0,Math.cos(phase+Math.PI)):0;
  limb(c,-4,-27,-4+lx1,-3-ly1,6,PAL.skin);limb(c,4,-27,4+lx2,-3-ly2,6,PAL.skin);
  // boot kulit pucat mid-calf + strap gelap + sol rata (referensi)
  const boot=(lx,ly)=>{c.save();c.translate(lx,-(ly||0));c.fillStyle=PAL.boot;rr(c,-5.6,-17,11.2,17,3.4);c.fill();outline(c,2.2);rr(c,-5.6,-17,11.2,17,3.4);c.stroke();
    c.strokeStyle=PAL.bootS;c.lineWidth=1.7;c.beginPath();c.moveTo(-4.8,-10);c.lineTo(4.8,-10);c.stroke(); // satu strap tipis
    c.lineWidth=2.4;c.beginPath();c.moveTo(-5,-1.2);c.lineTo(5,-1.2);c.stroke(); // sol rata
    c.restore();};
  boot(-4+lx1,ly1);boot(4+lx2,ly2);

  const bodyS  =kind==='muda'?PAL.uniOliveS:kind==='buron'?'#57462f':kind==='tua'?'#8E8168':PAL.coatS;

function rrPathPts(x,y,w,h,r,step=13){ // sampel jalur rounded-rect utk goresan tinta tangan
  const pts=[],seg=(x0,y0,x1,y1)=>{const n=Math.max(1,Math.round(Math.hypot(x1-x0,y1-y0)/step));for(let i=0;i<n;i++)pts.push([lerp(x0,x1,i/n),lerp(y0,y1,i/n)]);};

function sketchRR(c,x,y,w,h,r,opt={}){ // panel kertas + goresan tinta ganda (garis tak sempurna, khas tangan)
  const ink=opt.ink||PAL.line,base=opt.fill||PAPER_COL;

  const seed=mulberry32((((Math.round(x)*71)^(Math.round(y)*193)^(Math.round(w)*389)^(Math.round(h)*997))>>>0)||5); // jitter deterministik (tak berdesir antar frame)
  const pts=rrPathPts(x,y,w,h,Math.min(r,w/2,h/2));
  for(let k=0;k<2;k++){ // pass 0 garis utama; pass 1 goresan ikutan tipis — rasa digambar tangan

    const dx=k?.9:0,dy=k?-.7:0,j=k?2.8:1.7;

const D={node:null,ops:[],i:0,line:null,prog:0,popT:1,choices:null,sel:0,choiceT:0,duckT:false,elExpr:'neutral',arExpr:'neutral',arKind:'muda',ended:false};
const LOG=[]; // backlog dialog (30 terakhir) — buka dengan TAB/B
function startNode(id){const n=NODES[id];D.ops=(typeof n==='function')?n():n;D.i=0;D.node=id;SAVE.seen[id]=1;D.line=null;D.choices=null;
  D._poseBorn={}; // tiap node: pose fade dihitung ulang
  if(id==='paradox')markEnd('paradox');else if(id==='r3f')markEnd('rebut');else if(id==='true_end')markEnd('true'); // ending via node
  step();}
function step(){
  while(D.i<D.ops.length){
    const op=D.ops[D.i++];
    if(op.t==='say'){D.line=op;D.prog=0;D.popT=0;D.ffT=0;G.speak={who:op.who,t:0};
      SFX.flip(); // rustle kertas saat balon/panel baru muncul
      LOG.push({who:op.who,text:op.text});if(LOG.length>30)LOG.shift();
      if(op.who==='elena')D.elExpr=op.expr||'neutral';
      else if(op.who==='narrator'){}
      else D.arExpr=op.expr||'neutral';
      return;}
    if(op.t==='choice'){D.choices=op.opts;D.sel=0;D.line=null;D.choiceT=0;D.duckT=false;duckMusic(.5,.4);SFX.select();return;}
    if(op.t==='goto'){startNode(op.id);return;}
    if(op.t==='fx'){if(op.kind==='boom'){SFX.boom();G.shakeT=OPTS.reduceMotion?0:.9;G.shakeA=9;G.whiteFlash=OPTS.reduceMotion?.25:1;}if(op.kind==='chime')SFX.chime();continue;}
    if(op.t==='vortex'){startVortex(op.to,false);return;}
    if(op.t==='ending'){if(op.kind==='loop')startGlitch();else startEndCard();return;}
  }
}
function dialogAdvance(){
  if(D.choices){const o=D.choices[D.sel];SFX.confirm();if(o.fx)o.fx();
    SAVE.chosen[o.label]=1;persistSave(); // penanda "pernah dipilih" lintas loop
    const tg=o.tag||'';
    G.pulse=tg.includes('EMPATI')?{txt:'♥ +EMPATI',col:'#A85550',t:0}:
            tg.includes('LOGIS')?{txt:'⚙ +LOGIKA',col:'#556B7F',t:0}:null;
    D.choices=null;startNode(o.goto);return;}
  if(D.line){if(D.prog<1){D.prog=1;return;}D.line=null;step();return;}
}
function updateDialog(dt,mx,my){
  // backlog: TAB/B buka-tutup; ↑↓ gulir; ESC/klik tutup (kunci semua input dialog lain)
  if(keyOnce('Tab')||keyOnce('b')||keyOnce('B')){G.logOpen=!G.logOpen;G.logScroll=0;SFX.select();return;}
  if(G.logOpen){
    if(keyOnce('ArrowUp')||keyOnce('w'))G.logScroll=(G.logScroll||0)+1;
    if(keyOnce('ArrowDown')||keyOnce('s'))G.logScroll=Math.max(0,(G.logScroll||0)-1);
    if(keyOnce('Escape')||ptr.tap){ptr.tap=false;G.logOpen=false;SFX.select();}
    return;}
  // fast-forward: tahan CTRL/F (atau tombol ⏩ sentuh) — teks yang sudah pernah
  // dilihat dilewati otomatis; teks baru hanya diketik instan
  const ffT=IS_TOUCH&&ptr.down&&Math.hypot(ptr.x-46,ptr.y-(H-44))<28;
  const ff=keys['Control']||keys['f']||keys['F']||ffT;
  if(D.line&&!D.choices){
    if(ff&&SAVE.seen[D.node]){D.prog=1;D.ffT=(D.ffT||0)+dt;
      if(D.ffT>.07){D.ffT=0;D.line=null;step();return;}}
    else if(ff)D.prog=1;
  }
  if(D.line&&D.prog<1){D.prog=Math.min(1,D.prog+dt*46*OPTS.textSpd/Math.max(24,D.line.text.length));if(Math.random()<.3)beep(900+Math.random()*500,.015,'square',.012);} // ketik per-karakter (46 hps × SPD)
  if(D.line)D.popT=Math.min(1,D.popT+dt*5.5);
  if(G.speak)G.speak.t+=dt;
  // ducking musik: turun saat teks mengetik, naik lagi setelah selesai
  if(D.line&&D.prog<1&&!D.duckT){D.duckT=true;duckMusic(.55,.3);}
  if((!D.line||D.prog>=1)&&D.duckT){D.duckT=false;duckMusic(.85,1.2);}
  if(D.choices){D.choiceT=Math.min(1,D.choiceT+dt*4.5);
    if(keyOnce('ArrowUp')||keyOnce('w')){D.sel=(D.sel+D.choices.length-1)%D.choices.length;SFX.select();}
    if(keyOnce('ArrowDown')||keyOnce('s')){D.sel=(D.sel+1)%D.choices.length;SFX.select();}
    if(keyOnce('1')){D.sel=0;dialogAdvance();return;}
    if(keyOnce('2')&&D.choices&&D.choices.length>1){D.sel=1;dialogAdvance();return;}
    if(!D.choices)return;
    // hover
    let hov=-1;const bw=560,bh=D.choices.length*58+22,bx=(W-bw)/2,by=H-bh-24;
    D.choices.forEach((o,i)=>{const oy=by+14+i*58;if(mx>bx+10&&mx<bx+bw-10&&my>oy&&my<oy+52)hov=i;});
    if(hov>=0&&hov!==D.sel){D.sel=hov;SFX.select();}
    if(ptr.tap&&hov>=0){dialogAdvance();ptr.tap=false;}
    if(advHit())dialogAdvance();
  } else if(advHit()||ptr.tap){ptr.tap=false;dialogAdvance();}
}

function updatePause(){
  const items=pauseItems();
  if(keyOnce('Escape')){setPaused(false);SFX.select();return;}
  if(keyOnce('ArrowUp')||keyOnce('w')||keyOnce('W')){G.pSel=(G.pSel+items.length-1)%items.length;SFX.select();}
  if(keyOnce('ArrowDown')||keyOnce('s')||keyOnce('S')){G.pSel=(G.pSel+1)%items.length;SFX.select();}
  if(keyOnce('ArrowLeft')||keyOnce('-')||keyOnce('a')||keyOnce('A')){if(items[G.pSel].adj){items[G.pSel].adj(-1);SFX.select();}}
  if(keyOnce('ArrowRight')||keyOnce('+')||keyOnce('=')||keyOnce('d')||keyOnce('D')){if(items[G.pSel].adj){items[G.pSel].adj(1);SFX.select();}}
  if(keyOnce('Enter')||keyOnce(' ')){const it=items[G.pSel];SFX.confirm();if(it.act)it.act();}
  if(ptr.tap){const bw=460,bh=items.length*44+56,bx=(W-bw)/2,by=(H-bh)/2;
    items.forEach((it,i)=>{const iy=by+40+i*44;
      if(ptr.x>bx&&ptr.x<bx+bw&&ptr.y>iy&&ptr.y<iy+38){SFX.confirm();
        if(it.adj)it.adj(ptr.x>bx+bw/2?1:-1);else if(it.act)it.act();}});
    ptr.tap=false;}
}
function update(dt){
  T+=dt;G.t+=dt;
  if(G.pulse){G.pulse.t+=dt;if(G.pulse.t>1.5)G.pulse=null;}
  if(G.whiteFlash>0)G.whiteFlash-=dt*2.2;
  if(G.skyFlash>0)G.skyFlash-=dt*1.4;
  if(G.shakeT>0)G.shakeT-=dt;
  if(G.captionT>0)G.captionT-=dt;
  if(G.fadeIn>0)G.fadeIn=Math.max(0,G.fadeIn-dt*1.4); // transisi masuk dari hitam
  const mx=ptr.x,my=ptr.y;
  // hotspot UI pojok (mute/pause) via klik atau sentuhan — dicek DI SINI karena ptr.tap dibersihkan sebelum render()
  if(ptr.tap&&Math.hypot(ptr.x-(W-34),ptr.y-26)<20){toggleMute();ptr.tap=false;}
  else if(ptr.tap&&!G.paused&&(G.state==='walk'||G.state==='dialog'||G.state==='prologue')&&Math.hypot(ptr.x-(W-72),ptr.y-26)<20){ptr.tap=false;setPaused(true);G.pSel=0;SFX.select();}
  if(G.paused){updatePause();}
  else if(keyOnce('Escape')&&!G.logOpen&&(G.state==='walk'||G.state==='dialog'||G.state==='prologue')){setPaused(true);G.pSel=0;SFX.select();}
  else switch(G.state){
    case 'load':
      if(AS.ready){G.state='title';G.titleT=0;G.titleReady=false;}
      break;
    case 'title':
      setAmbOnce('title');
      G.titleT+=dt;G.titleReady=OPTS.reduceMotion||G.titleT>=8.4;
      if(!G.titleReady&&(advHit()||ptr.tap)){ptr.tap=false;G.titleT=8.4;G.titleReady=true;SFX.select();break;}
      if(G.titleReady&&SAVE.game&&(keyOnce('l')||keyOnce('L'))){SFX.confirm();Object.assign(S,SAVE.game.S);G.fadeIn=1;startWalk(SAVE.game.era);break;}
      if(G.titleReady&&(advHit()||ptr.tap)){ptr.tap=false;SFX.confirm();resetAll();G.state='prologue';G.fadeIn=1;startNode('prologue');setAmbience('2088');SFX.heart();}
      break;
    case 'prologue':
      if((T%2.4)<dt)SFX.heart();
      updateDialog(dt,mx,my);break;
    case 'walk':{
      setAmbOnce(ERA_CONF[G.era].amb);
      if(G.lore){ // sedang membaca titik selidik: langkah berhenti halus; ENTER/↓/ketuk memajukan baris
        G.player.vx-=clamp(G.player.vx,-1400*dt,1400*dt);G.player.moving=false;
        G.lore.prog=Math.min(1,G.lore.prog+dt*2.4);G.lore.popT=Math.min(1,G.lore.popT+dt*5);
        if(advHit()||ptr.tap||keyOnce('ArrowDown')||keyOnce('s')||keyOnce('S')){ptr.tap=false;
          if(G.lore.prog<1)G.lore.prog=1;
          else{G.lore.i++;SFX.select();if(G.lore.i>=G.lore.lines.length)G.lore=null;else{G.lore.prog=0;G.lore.popT=0;}}}
        break;}
      const p=G.player;let dir=0;
      if(keys['ArrowRight']||keys['d']||keys['D'])dir+=1;
      if(keys['ArrowLeft']||keys['a']||keys['A'])dir-=1;
      // tombol sentuh: ◀ ▶ gerak (zona bawah), tombol ≫ = lari
      const touchRun=IS_TOUCH&&ptr.down&&Math.hypot(ptr.x-(W-36),ptr.y-(H-162))<30;
      if(IS_TOUCH&&ptr.down){if(ptr.x>W-140&&ptr.y>H-130)dir=1;else if(ptr.x<140&&ptr.y>H-130)dir=-1;}
      // model fisika: akselerasi menuju kecepatan target, gesekan saat lepas
      // loop > 0: lari jadi bawaan (Shift / tombol ≫ berbalik jadi jalan pelan)
      const sprint=keys['Shift']||touchRun,top=(S.loop>0?!sprint:sprint)?262:150,accel=900,fric=1400;
      const prevVx=p.vx;
      if(dir!==0){
        if(dir>0!==p.facingRight){p.facingRight=dir>0;p.turnT=.14;} // squash saat berbalik
        p.vx+=clamp(dir*top-p.vx,-accel*dt,accel*dt);
        if(Math.abs(prevVx)<10)parts.push({x:p.x-G.cam,y:GROUND-3,vx:-dir*24,vy:-14,grav:80,l:0,ml:.4,r:2.4,col:'rgba(170,150,120,.5)',shrink:1}); // debu awal langkah
      }else p.vx-=clamp(p.vx,-fric*dt,fric*dt);
      p.x=clamp(p.x+p.vx*dt,64,G.walk.len-40);
      if((p.x===64&&p.vx<0)||(p.x===G.walk.len-40&&p.vx>0))p.vx=0; // mentok dinding: nolkan dorongan
      p.acc=lerp(p.acc,(p.vx-prevVx)/Math.max(dt,1e-4),1-Math.pow(.01,dt)); // pitch badan saat akselerasi
      if(dir===0&&Math.abs(prevVx)>140&&Math.abs(p.vx)<10)for(let k=0;k<3;k++)parts.push({x:p.x-G.cam+(Math.random()-.5)*10,y:GROUND-3,vx:(p.facingRight?1:-1)*(14+Math.random()*22)+(Math.random()-.5)*10,vy:-8-Math.random()*16,grav:80,l:0,ml:.45+Math.random()*.2,r:2+Math.random()*2,col:'rgba(170,150,120,.5)',shrink:1}); // debu berhenti keras
      if(p.turnT>0)p.turnT-=dt;
      const old=p.phase;
      p.phase+=Math.abs(p.vx)*dt*.105; // irama dikunci longgar ke tanah: 1 siklus (2 langkah) ≈ 60px layar — anti-selip tanpa cadence panik (0 saat mentok dinding → tak moonwalk)
      p.moving=Math.abs(p.vx)>8;
      p.stride=clamp(Math.abs(p.vx)/262,0,1);
      if(p.moving&&Math.floor(old/Math.PI)!==Math.floor(p.phase/Math.PI)){SFX.step();
        for(let k=0;k<2;k++)parts.push({x:p.x-G.cam+(Math.random()-.5)*8,y:GROUND-3,vx:-(Math.sign(p.vx)||1)*(20+Math.random()*24),vy:-10-Math.random()*20,grav:80,l:0,ml:.45+Math.random()*.25,r:2+Math.random()*2,col:'rgba(170,150,120,.5)',shrink:1});}
      G.camTarget=clamp(p.x-300+clamp(p.vx*.22,-75,75),0,G.walk.len-W);G.cam=lerp(G.cam,G.camTarget,1-Math.pow(.001,dt)); // look-ahead 22% kecepatan (camera-systems) di atas exp-smoothing yg sudah ada
      spawnParts(G.era); // partikel mengikuti era aktif (1999: motes biru, bukan abu 1944)
      if(G.era==='1944'){AU.boomTimer-=dt;if(AU.boomTimer<=0){AU.boomTimer=6+Math.random()*7;G.skyFlash=1;noise(1.4,70,.14);}}
      // titik selidik: deteksi kedekatan + picu (↓ / S / ketuk penanda)
      const FEh=G.era==='1968'?'1968'+S.routeB1:G.era;
      const hs=(HOTSPOTS[FEh]||[]).find(h=>!SAVE.inspected[h.id]&&Math.abs(p.x-h.x)<52);
      G.walk.hot=hs||null;
      if(hs&&(keyOnce('ArrowDown')||keyOnce('s')||keyOnce('S')||(ptr.tap&&Math.hypot(ptr.x-(hs.x-G.cam),ptr.y-(GROUND-14))<40))){ptr.tap=false;
        SAVE.inspected[hs.id]=1;persistSave();SFX.select();G.lore={lines:LORE[hs.id],i:0,prog:0,popT:0};G.walk.hot=null;break;}
      if(p.x>G.walk.arX-175){G.state='dialog';G.camTarget=clamp(G.walk.arX-640,0,G.walk.len-W);
        D.arKind=G.walk.ar;D.arExpr='neutral';D.elExpr='neutral';startNode(G.walk.node);}
      break;}
    case 'dialog':
      if(G.cam!==G.camTarget)G.cam=lerp(G.cam,G.camTarget,1-Math.pow(.002,dt));
      spawnParts(G.era==='1968'?'1968':G.era);
      if(G.era==='1944'){AU.boomTimer-=dt;if(AU.boomTimer<=0){AU.boomTimer=6+Math.random()*7;G.skyFlash=1;noise(1.4,70,.12);}}
      updateDialog(dt,mx,my);break;
    case 'vortex':{
      G.vortex.t+=dt/2.4;
      for(let i=0;i<2;i++)parts.push({x:W/2,y:H/2,vx:(Math.random()-.5)*520,vy:(Math.random()-.5)*400,l:0,ml:.5,r:1.4+Math.random()*1.6,col:G.vortex.rewind?'rgba(255,120,90,.8)':'rgba(150,225,255,.8)',shrink:1});
      if(G.vortex.t>=1){const to=G.vortex.to;G.vortex=null;G.whiteFlash=1;
        if(to==='1944')startWalk('1944');else if(to==='1968')startWalk('1968');else startWalk('1999');}
      break;}
    case 'glitch':
      G.glitch.t+=dt;
      if(G.glitch.t>1.7){G.glitch=null;startVortex('1944',true);}
      break;
    case 'endcard':
      G.endCard.t+=dt;
      // sparkle hati merah muda & emas merayakan true ending
      if(Math.random()<.12)parts.push({x:Math.random()*W,y:H+10,vx:(Math.random()-.5)*16,vy:-22-Math.random()*26,l:0,ml:3.5+Math.random()*2,r:1+Math.random()*1.4,col:Math.random()<.6?'rgba(228,140,150,.85)':'rgba(240,205,130,.85)',pulse:1,heart:Math.random()<.45});
      if((G.endCard.t>2)&&(advHit()||ptr.tap)){ptr.tap=false;SFX.confirm();G.state='title';G.t=0;G.titleT=0;G.titleReady=false;setAmbience('title');}
      break;
  }
  ptr.tap=false;
  for(const k in pressed)pressed[k]=false;
}

function drawHourglass(c,x,y,s,t){
  const mot=OPTS.reduceMotion?0:1;
  c.save();c.translate(x,y);c.scale(s,s);c.lineJoin='round';c.lineCap='round';
  c.shadowColor='rgba(226,90,70,.8)';c.shadowBlur=9+4*mot*Math.sin(t*2.2);
  c.strokeStyle='#F5F0E8';c.lineWidth=2.2;
  c.beginPath();c.moveTo(-12,-16);c.lineTo(12,-16);c.moveTo(-12,16);c.lineTo(12,16);c.stroke(); // palang atas-bawah
  c.beginPath();c.moveTo(-9,-16);c.lineTo(9,-16);c.lineTo(1.7,-1.6);c.lineTo(-1.7,-1.6);c.closePath(); // rongga atas
  c.moveTo(-9,16);c.lineTo(9,16);c.lineTo(1.7,1.6);c.lineTo(-1.7,1.6);c.closePath();c.stroke(); // rongga bawah
  // pasir merah: arus terus menetes, timbunan naik-turun mengikuti siklus (motif loop)
  const ph=mot?1-Math.abs((t*.36)%2-1):.5;
  c.fillStyle='#E05555';c.shadowColor='#E05555';c.shadowBlur=7;
  const hp=2.5+9*ph;c.beginPath();c.moveTo(-hp*.6,15);c.lineTo(hp*.6,15);c.lineTo(0,15-hp);c.closePath();c.fill();
  c.globalAlpha=.85;c.fillRect(-.9,-1.6,1.8,14);
  for(let i=0;i<3;i++){const yy=-1+((t*(8+2*i)+i*5.3)%15);c.beginPath();c.arc((i-1)*1.1,yy,1,0,TAU);c.fill();}
  c.restore();
}

}
function drawPauseBtn(c){
  if(G.paused||!(G.state==='walk'||G.state==='dialog'||G.state==='prologue'))return;
  const x=W-72,y=26;c.save();c.globalAlpha=.65;c.fillStyle='#0a0806';c.beginPath();c.arc(x,y,15,0,TAU);c.fill();
  c.strokeStyle='#F5F0E8';c.lineWidth=1.6;c.beginPath();c.arc(x,y,15,0,TAU);c.stroke();
  c.fillStyle='#F5F0E8';c.font='13px sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText('⏸',x,y+1);c.restore();c.textBaseline='alphabetic'; // logika tap pindah ke update() (ptr.tap tak pernah hidup di render)
}
function drawPause(c){ // panel jeda kertas + tinta
  c.fillStyle='rgba(6,5,4,.74)';c.fillRect(0,0,W,H);
  const items=pauseItems(),bw=460,bh=items.length*44+56,bx=(W-bw)/2,by=(H-bh)/2;
  c.save();
  sketchRR(c,bx,by,bw,bh,8);
  c.textAlign='center';c.fillStyle='#94342E';c.font='bold 19px '+F_UI;c.fillText('— JEDA —',W/2,by+28);
  items.forEach((it,i)=>{const iy=by+40+i*44,on=i===G.pSel;
    if(on){c.fillStyle='rgba(148,52,46,.10)';rr(c,bx+10,iy,bw-20,38,6);c.fill();
      c.strokeStyle='#94342E';c.lineWidth=2.6;c.lineCap='round';c.beginPath();c.moveTo(bx+16,iy+8);c.quadraticCurveTo(bx+14,iy+19,bx+16,iy+30);c.stroke();}
    c.fillStyle=on?'#94342E':'#2B211A';c.font=(on?'bold ':'')+'16px '+F_UI;
    c.fillText((on?'▶ ':'')+it.label,W/2,iy+24);});
  c.restore();
  c.fillStyle='rgba(243,234,218,.5)';c.font='12.5px '+F_UI;c.textAlign='center';
  c.fillText('ESC: lanjut  •  ↑↓: pilih  •  ←→: ubah  •  ENTER: oke',W/2,by+bh+24);
}
function hintAdvance(c){const bob=OPTS.reduceMotion?0:Math.sin(T*2.4)*1.6;c.save();c.translate(0,bob);c.fillStyle=`rgba(245,240,232,${.4+.3*Math.sin(T*5)})`;c.font='13.5px '+F_UI;c.textAlign='center';c.fillText('▼ ENTER / KLIK',W/2,H-10);c.restore();} // napas alfa + bob halus (missed-opportunity motion)
function drawLog(c){ // overlay backlog — TAB/B; riwayat 30 dialog terakhir (halaman buku catatan)
  const boxW=720,pad=22,bx=(W-boxW)/2,by=48,bh=H-96,lineH=18;
  c.save();c.fillStyle='rgba(6,5,4,.82)';c.fillRect(0,0,W,H);
  sketchRR(c,bx,by,boxW,bh,8);
  c.textAlign='left';c.textBaseline='top';
  c.fillStyle='#94342E';c.font='bold 15px '+F_UI;c.fillText('— CATATAN DIALOG —',bx+pad,by+13);
  // rakit baris terbungkus dari riwayat (yang terbaru di bawah)
  const rows=[];
  c.font='15px '+F_UI;
  LOG.forEach(e=>{const nm=e.who==='narrator'?'':(WHO[e.who]?WHO[e.who].name:String(e.who).toUpperCase());
    wrap(c,e.text,boxW-pad*2-94).forEach((ln,k)=>rows.push({nm:k?'':nm,txt:ln,narr:e.who==='narrator'}));});
  const maxRows=Math.floor((bh-58)/lineH);
  G.logScroll=clamp(G.logScroll||0,0,Math.max(0,rows.length-maxRows));
  const end=rows.length-G.logScroll,start=Math.max(0,end-maxRows);
  let y=by+40;
  for(let i=start;i<end&&y<by+bh-30;i++){const r=rows[i];
    if(r.nm){c.fillStyle='#94342E';c.font='bold 11px '+F_UI;c.fillText(r.nm,bx+pad,y+3);c.font='15px '+F_UI;}
    c.fillStyle=r.narr?'rgba(43,33,26,.62)':'#2B211A';c.fillText(r.txt,bx+pad+88,y);y+=lineH;}
  if(!rows.length){c.fillStyle='rgba(43,33,26,.55)';c.fillText('Belum ada dialog terekam.',bx+pad,y);}
  c.fillStyle='rgba(43,33,26,.5)';c.font='12px '+F_UI;c.textAlign='center';
  c.fillText('↑↓: gulir  •  TAB / ESC / KLIK: tutup',bx+boxW/2,by+bh-16);
  c.restore();c.textBaseline='alphabetic';
}
function drawMuteBtn(c){
  const x=W-34,y=26;c.save();c.globalAlpha=.65;c.fillStyle='#0a0806';c.beginPath();c.arc(x,y,15,0,TAU);c.fill();
  c.strokeStyle='#F5F0E8';c.lineWidth=1.6;c.beginPath();c.arc(x,y,15,0,TAU);c.stroke();
  c.fillStyle='#F5F0E8';c.font='13px sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText(AU.muted?'🔇':'🔊',x,y+1);c.restore();c.textBaseline='alphabetic'; // logika tap pindah ke update()
}
function toggleMute(){AU.muted=!AU.muted;if(AU.master)AU.master.gain.value=AU.muted?0:vGain(OPTS.vol);
  if(!AU.muted){setAmbience(G.state==='title'?'title':(ERA_CONF[G.era]?ERA_CONF[G.era].amb:'2088'));}}

/* ---------- loop utama ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  try{
  if(keyOnce('m')||keyOnce('M'))toggleMute();
  update(dt);render();
  }catch(e){if(!frame.errOnce){frame.errOnce=true;console.error(e);}}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// hemat audio: hentikan konteks WebAudio saat tab tidak terlihat
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;
  if(document.hidden)AU.ctx.suspend();else if(!G.paused)AU.ctx.resume();});
</script>
